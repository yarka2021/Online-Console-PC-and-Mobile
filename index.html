<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RetroStation OS: ZENITH v101</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Syncopate:wght@700&family=Inter:wght@100;400;900&display=swap');
        
        :root { --neon: #00f2ff; --bg: #000; }
        *{box-sizing:border-box; margin:0; padding:0; cursor: none !important;}
        
        body { 
            background-color: #000; 
            color: white; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
            height: 100vh;
            perspective: 2000px;
        }

        #particle-canvas { position: fixed; inset: 0; z-index: 100000; pointer-events: none; }
        #nebula-bg { position: fixed; inset: -100px; z-index: -2; background: radial-gradient(circle at center, #001229, #000); transition: 2s ease; filter: blur(60px); }

        /* --- 3D ИНТЕРФЕЙС --- */
        #scroller { display: flex; align-items: center; height: 100%; transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); transform-style: preserve-3d; }
        .omni-card {
            min-width: 350px; height: 500px;
            background: rgba(255,255,255,0.02);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            margin: 0 80px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
        }
        .omni-card.active { border-color: var(--neon); box-shadow: 0 0 100px rgba(0, 242, 255, 0.2); transform: translateZ(200px) rotateX(5deg); }
        .omni-card img { width: 90%; height: 80%; object-fit: cover; border-radius: 25px; transition: 0.5s; }

        /* --- HUD --- */
        .hud-left { position: fixed; top: 40px; left: 40px; font-family: 'Orbitron', sans-serif; z-index: 100; }
        .hud-right { position: fixed; top: 40px; right: 40px; text-align: right; font-family: 'Orbitron', sans-serif; z-index: 100; }
        .nickname-display { cursor: pointer !important; transition: 0.3s; border-bottom: 1px dashed transparent; }
        .nickname-display:hover { color: var(--neon); border-bottom-color: var(--neon); }

        #cursor { position: fixed; width: 40px; height: 40px; border: 1px solid var(--neon); border-radius: 50%; pointer-events: none; z-index: 1000000; mix-blend-mode: screen; transition: transform 0.1s linear; }
        #emulator-container { display: none; position: fixed; inset: 0; z-index: 200000; background: #000; }
        
        .is-psx [data-button]::after { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: white !important; font-size: 24px; visibility: visible; font-weight: 900; }
        .is-psx [data-button="a"]::after { content: "✖"; color: #88aaff !important; }
        .is-psx [data-button="b"]::after { content: "●"; color: #ff8888 !important; }
        .is-psx [data-button="x"]::after { content: "■"; color: #ffcc88 !important; }
        .is-psx [data-button="y"]::after { content: "▲"; color: #88ff88 !important; }
        .is-psx [data-button] { color: transparent !important; }
    </style>
</head>
<body onclick="bootSystem()">

<canvas id="particle-canvas"></canvas>
<div id="cursor"></div>
<div id="nebula-bg"></div>

<!-- HUD -->
<div id="ui-layer" class="h-screen flex flex-col opacity-0 transition-opacity duration-2000">
    <div class="hud-left">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 bg-cyan-400 rounded-full animate-pulse shadow-[0_0_10px_#00f2ff]"></div>
            <span class="text-xs font-black tracking-widest text-cyan-400">ZENITH ID SYSTEM</span>
        </div>
        <h1 class="text-4xl font-black italic tracking-tighter mt-2 font-syncopate nickname-display" id="user-name" onclick="changeNickname(event)">PLAYER ONE</h1>
        <p class="text-[10px] mt-2 opacity-50 uppercase tracking-[0.3em]" id="user-status">ONLINE / NEURAL LINK READY</p>
    </div>

    <div class="hud-right">
        <div id="clock" class="text-3xl font-light">00:00</div>
        <div class="text-[10px] text-cyan-400 font-black mt-2">HONOR 600 • MULTIPLAYER</div>
    </div>

    <!-- 3D КАРУСЕЛЬ -->
    <div id="scroller-container" class="flex-1 flex items-center justify-center overflow-hidden">
        <div id="scroller"></div>
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ -->
    <div class="fixed bottom-10 left-1/2 -translate-x-1/2 flex items-center gap-10 bg-white/5 backdrop-blur-xl px-10 py-4 rounded-full border border-white/10 z-100">
        <button onclick="document.getElementById('fileInput').click()" class="text-[10px] font-black uppercase tracking-widest hover:text-cyan-400 transition">Import Rom</button>
        <div class="w-14 h-14 bg-white text-black rounded-full flex items-center justify-center font-black text-xl hover:scale-110 transition active:scale-95" onclick="launchCurrent()">▶</div>
        <button onclick="exportLibrary()" class="text-[10px] font-black uppercase tracking-widest hover:text-cyan-400 transition">Sync Cloud</button>
    </div>
</div>

<!-- ЗАСТАВКА -->
<div id="boot-overlay" class="fixed inset-0 bg-black z-[100000] flex items-center justify-center flex-col">
    <h1 class="text-5xl font-syncopate font-bold tracking-widest animate-pulse">RETROSTATION</h1>
    <div class="w-64 h-1 bg-white/10 mt-6 rounded-full overflow-hidden">
        <div id="boot-progress" class="h-full bg-cyan-400" style="width: 0%"></div>
    </div>
</div>

<div id="emulator-container">
    <div id="game" style="width:100%; height:100%;"></div>
    <button onclick="location.reload()" class="absolute top-10 right-10 bg-white/10 backdrop-blur-md px-8 py-3 rounded-full font-black uppercase text-xs">Terminate Link</button>
</div>

<input type="file" id="fileInput" class="hidden" multiple onchange="importGames(event)">

<script>
    const db = new Dexie("ZenithMasterDB_v101");
    db.version(1).stores({ 
        games: '++id, title, system, romBlob, cover',
        settings: 'key, value'
    });

    let games = [], currentIndex = 0, audioUnlocked = false, userNickname = "PLAYER ONE";
    const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);

    // --- СИСТЕМА НИКНЕЙМА ---
    async function loadNickname() {
        const saved = await db.settings.get("nickname");
        if (saved) {
            userNickname = saved.value;
            document.getElementById('user-name').innerText = userNickname;
        }
    }

    async function changeNickname(e) {
        e.stopPropagation();
        const newName = prompt("Введите ваш новый нейро-идентификатор (Nickname):", userNickname);
        if (newName && newName.trim() !== "") {
            userNickname = newName.trim().toUpperCase();
            await db.settings.put({ key: "nickname", value: userNickname });
            document.getElementById('user-name').innerText = userNickname;
            
            // Эффекты
            createParticles(e.clientX, e.clientY, '#00f2ff');
            if(navigator.vibrate) navigator.vibrate(100);
            speak(`Идентификатор изменен. Приветствую, ${userNickname}`);
        }
    }

    // --- ГОЛОСОВОЙ ИИ ---
    const synth = window.webkitspeechSynthesis || window.speechSynthesis;
    function speak(text) {
        if (!audioUnlocked) return;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ru-RU';
        utterance.rate = 1.1;
        synth.speak(utterance);
    }

    // --- ЧАСТИЦЫ ---
    const pCanvas = document.getElementById('particle-canvas');
    const pCtx = pCanvas.getContext('2d');
    pCanvas.width = window.innerWidth; pCanvas.height = window.innerHeight;
    let particles = [];

    function createParticles(x, y, color) {
        for(let i=0; i<30; i++) {
            particles.push({ x, y, vx: (Math.random()-0.5)*12, vy: (Math.random()-0.5)*12, size: Math.random()*4, color, life: 1 });
        }
    }

    function updateParticles() {
        pCtx.clearRect(0,0,pCanvas.width, pCanvas.height);
        particles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy; p.life -= 0.02;
            pCtx.fillStyle = p.color; pCtx.globalAlpha = p.life;
            pCtx.beginPath(); pCtx.arc(p.x, p.y, p.size, 0, Math.PI*2); pCtx.fill();
            if(p.life <= 0) particles.splice(i, 1);
        });
        requestAnimationFrame(updateParticles);
    }
    updateParticles();

    // --- ЗАГРУЗКА ---
    function bootSystem() {
        if(audioUnlocked) return;
        audioUnlocked = true;
        const prog = document.getElementById('boot-progress');
        let w = 0;
        const int = setInterval(() => {
            w += 5; prog.style.width = w + '%';
            if(w >= 100) {
                clearInterval(int);
                document.getElementById('boot-overlay').style.opacity = 0;
                document.getElementById('ui-layer').style.opacity = 1;
                speak(`Система Зенит онлайн. Добро пожаловать, ${userNickname}.`);
                setTimeout(() => document.getElementById('boot-overlay').remove(), 1000);
            }
        }, 40);
    }

    // --- БИБЛИОТЕКА ---
    async function renderLibrary() {
        games = await db.games.toArray();
        const scroller = document.getElementById('scroller');
        scroller.innerHTML = '';

        if(games.length === 0) {
            scroller.innerHTML = `<div class="omni-card active font-black text-center p-10 uppercase italic" onclick="document.getElementById('fileInput').click()">FEED DATA MODULE<br><span class="text-[10px] opacity-40 mt-4 block">Click to import ROMs</span></div>`;
            return;
        }

        games.forEach((game, i) => {
            const card = document.createElement('div');
            card.className = `omni-card ${i === currentIndex ? 'active' : ''}`;
            card.innerHTML = `<img src="${game.cover}" onerror="this.src='https://via.placeholder.com/350x500/000/fff?text=${game.title}'"><div class="mt-6 text-center"><p class="text-[8px] font-black tracking-[0.5em] text-cyan-400 uppercase">${game.system}</p><h2 class="text-2xl font-black italic uppercase tracking-tighter">${game.title}</h2></div>`;
            card.onclick = () => { if(i === currentIndex) launchCurrent(); else { currentIndex = i; updateSelection(); } };
            scroller.appendChild(card);
        });
        updateSelection();
    }

    function updateSelection() {
        const offset = window.innerWidth / 2 - (currentIndex * 510) - 175;
        document.getElementById('scroller').style.transform = `translateX(${offset}px)`;
        document.querySelectorAll('.omni-card').forEach((c, i) => {
            const dist = Math.abs(i - currentIndex);
            c.classList.toggle('active', i === currentIndex);
            c.style.opacity = dist > 2 ? 0 : (1 - dist * 0.4);
            c.style.transform = `rotateY(${(i - currentIndex) * -35}deg) scale(${i === currentIndex ? 1.1 : 0.75})`;
        });
        if(games[currentIndex]) {
            const colors = ['#00439c', '#5e0000', '#005e1a', '#4a005e', '#00f2ff'];
            document.getElementById('nebula-bg').style.background = `radial-gradient(circle at center, ${colors[currentIndex % colors.length]}44, #000)`;
        }
    }

    async function launchCurrent() {
        const game = games[currentIndex];
        if(!game) return;
        document.getElementById('emulator-container').style.display = 'block';
        
        // --- ПЕРЕДАЧА НИКА В ЭМУЛЯТОР ---
        window.EJS_player = '#game';
        window.EJS_gameUrl = URL.createObjectURL(game.romBlob);
        window.EJS_core = game.system;
        window.EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/';
        window.EJS_startOnLoad = true;
        window.EJS_netplayNickname = userNickname; // Твой ник в онлайне!
        
        if(isMobile) window.EJS_browserMode = 'mobile';
        if(game.system === 'psx') document.getElementById('emulator-container').classList.add('is-psx');

        const script = document.createElement('script');
        script.src = 'https://rawcdn.githack.com/EmulatorJS/EmulatorJS/main/data/loader.js';
        document.body.appendChild(script);
    }

    async function importGames(event) {
        for (const file of event.target.files) {
            const title = file.name.replace(/\.[^/.]+$/, "");
            const cover = `https://raw.githubusercontent.com/libretro-thumbnails/libretro-thumbnails/master/Sony_-_PlayStation/Named_Boxarts/${encodeURIComponent(title)}.png`;
            await db.games.add({ title, system: 'nes', romBlob: file, cover });
        }
        renderLibrary();
    }

    document.addEventListener('mousemove', e => {
        const c = document.getElementById('cursor');
        c.style.left = e.clientX - 20 + 'px';
        c.style.top = e.clientY - 20 + 'px';
    });

    loadNickname();
    renderLibrary();
    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}); }, 1000);
</script>
</body>
</html>
