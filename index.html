<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RetroStation Ultimate Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700;800&display=swap');
        body { background: #020617; color: white; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .font-brand { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        #game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        @media (min-width: 768px) { #game-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); } }
        .game-card { transition: 0.3s; position: relative; border-radius: 15px; overflow: hidden; background: #1e293b; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .game-card:hover { transform: translateY(-5px); border-color: #3b82f6; }
        .delete-btn { position: absolute; top: 8px; right: 8px; background: rgba(239, 68, 68, 0.9); width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 20; font-weight: bold; font-size: 18px; }
        .active-filter { background: #3b82f6 !important; color: white; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
        #emulator-container { display: none; position: fixed; inset: 0; z-index: 9999; background: #000; }
        
        /* PS UI Symbols */
        .is-psx [data-button], .is-ps2 [data-button] { color: transparent !important; position: relative; }
        .is-psx [data-button]::after, .is-ps2 [data-button]::after { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: white !important; font-size: 22px; visibility: visible; font-weight: bold; }
        .is-psx [data-button="a"]::after, .is-ps2 [data-button="a"]::after { content: "✖"; color: #88aaff !important; }
        .is-psx [data-button="b"]::after, .is-ps2 [data-button="b"]::after { content: "●"; color: #ff8888 !important; }
        .is-psx [data-button="x"]::after, .is-ps2 [data-button="x"]::after { content: "■"; color: #ffcc88 !important; }
        .is-psx [data-button="y"]::after, .is-ps2 [data-button="y"]::after { content: "▲"; color: #88ff88 !important; }
        .is-psx [data-button="l2"], .is-psx [data-button="r2"], .is-ps2 [data-button="l2"], .is-ps2 [data-button="r2"] { display: flex !important; visibility: visible !important; opacity: 1 !important; }

        .emu-ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 10000; pointer-events: none; }
        .emu-ui button { pointer-events: auto; background: rgba(0,0,0,0.6); color: white; padding: 8px 15px; border-radius: 10px; font-size: 11px; font-weight: bold; }
        .cover-art { aspect-ratio: 3/4; background: linear-gradient(45deg, #0f172a, #1e293b); display: flex; align-items: center; justify-content: center; text-align: center; padding: 15px; font-size: 12px; font-weight: 800; border-bottom: 3px solid #3b82f6; text-transform: uppercase; color: #94a3b8; }
        .filter-section-title { font-size: 10px; font-weight: 900; color: #475569; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; margin-top: 15px; }
    </style>
</head>
<body>

<div id="ui-layer" class="p-5 max-w-7xl mx-auto">
    <header class="flex flex-col md:flex-row justify-between items-center gap-6 mb-10 text-center md:text-left">
        <h1 class="text-4xl font-brand italic text-blue-500 tracking-tighter uppercase">Retro Station</h1>
        <div class="flex flex-wrap gap-2 justify-center">
            <button onclick="toggleFullScreen()" class="glass px-4 py-3 rounded-xl text-xs font-bold uppercase text-white">Экран</button>
            <button onclick="document.getElementById('fileInput').click()" class="bg-blue-600 px-6 py-3 rounded-xl font-black text-sm shadow-lg active:scale-95 transition">+ ДОБАВИТЬ</button>
            <button onclick="document.getElementById('biosInput').click()" class="glass px-4 py-3 rounded-xl text-xs uppercase italic">BIOS PS1</button>
        </div>
    </header>

    <div class="flex flex-col gap-1 mb-8 overflow-x-auto no-scrollbar">
        <button onclick="filterSystem('all', this)" class="filter-btn active-filter glass px-6 py-2 rounded-full text-[10px] font-bold uppercase text-white w-max">Все</button>
        <div class="filter-section-title">Sony & Nintendo</div>
        <div class="flex gap-2 pb-2 items-start">
            <button onclick="filterSystem('psx', this)" class="filter-btn glass px-5 py-2 rounded-full text-[10px] font-bold text-indigo-400 uppercase">PS1</button>
            <button onclick="filterSystem('ps2', this)" class="filter-btn glass px-5 py-2 rounded-full text-[10px] font-bold text-blue-400 uppercase">PS2 (Exp)</button>
            <button onclick="filterSystem('3ds', this)" class="filter-btn glass px-5 py-2 rounded-full text-[10px] font-bold text-red-300 uppercase">3DS</button>
            <button onclick="filterSystem('gba', this)" class="filter-btn glass px-5 py-2 rounded-full text-[10px] font-bold text-green-400 uppercase">GBA</button>
            <button onclick="filterSystem('gbc', this)" class="filter-btn glass px-5 py-2 rounded-full text-[10px] font-bold text-yellow-400 uppercase">GBC</button>
            <button onclick="filterSystem('gb', this)" class="filter-btn glass px-5 py-2 rounded-full text-[10px] font-bold text-emerald-400 uppercase">GB</button>
            <button onclick="filterSystem('nes', this)" class="filter-btn glass px-5 py-2 rounded-full text-[10px] font-bold text-white uppercase">NES</button>
        </div>
    </div>
    <div id="game-grid"></div>
</div>

<div id="emulator-container">
    <div class="emu-ui">
        <button onclick="stopEmulator()" style="color: #ff4d4d;">ВЫЙТИ</button>
        <button onclick="alert('Если кнопки не работают, кликните один раз по центру экрана игры.')">ПОМОЩЬ</button>
    </div>
    <div id="game" style="width:100%; height:100%;"></div>
</div>

<input type="file" id="fileInput" class="hidden" multiple onchange="addGames(event)">
<input type="file" id="biosInput" class="hidden" onchange="addBios(event)">

<script>
    const db = new Dexie("RetroFixDB");
    db.version(1).stores({ games: '++id, title, system, romBlob', config: 'name, blob' });

    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 0);

    const systemMap = {
        'nes': 'nes', 'snes': 'snes', 'sfc': 'snes', 'gba': 'gba', 'gb': 'gb', 'gbc': 'gbc',
        'bin': 'psx', 'chd': 'psx', 'iso': 'psx', '3ds': '3ds', 'cia': '3ds'
    };

    async function renderGames(filter = 'all') {
        const grid = document.getElementById('game-grid');
        grid.innerHTML = '';
        const games = await db.games.toArray();
        const filtered = filter === 'all' ? games : games.filter(g => g.system === (filter === 'ps2' ? 'play' : filter));
        filtered.forEach(game => {
            const card = document.createElement('div');
            card.className = 'game-card shadow-lg border border-white/5';
            card.innerHTML = `<div class="delete-btn" onclick="deleteGame(event, ${game.id})">×</div><div onclick="startEmulator(${game.id})"><div class="cover-art font-bold text-center">${game.title}</div><div class="p-3 text-center uppercase"><div class="text-[9px] text-blue-400 font-black">${game.system}</div><div class="truncate text-xs font-bold text-slate-300 italic">${game.title}</div></div></div>`;
            grid.appendChild(card);
        });
    }

    async function addGames(event) {
        for (const file of event.target.files) {
            const ext = file.name.split('.').pop().toLowerCase();
            let system = systemMap[ext] || 'nes';
            if (ext === 'iso') system = confirm("Это PS2?") ? 'play' : 'psx';
            await db.games.add({ title: file.name.replace(/\.[^/.]+$/, ""), system, romBlob: file });
        }
        renderGames();
    }

    async function startEmulator(gameId) {
        const game = await db.games.get(gameId);
        const container = document.getElementById('emulator-container');
        container.classList.remove('is-psx', 'is-ps2');
        if (game.system === 'psx') container.classList.add('is-psx');
        if (game.system === 'play') container.classList.add('is-ps2');
        container.style.display = 'block';

        // КРИТИЧЕСКИЙ ФИКС: Ссылки на стабильный сервер
        window.EJS_player = '#game';
        window.EJS_gameUrl = URL.createObjectURL(game.romBlob);
        window.EJS_core = game.system;
        
        // Используем CDN с корректными MIME-типами
        window.EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/';
        window.EJS_startOnLoad = true;
        if (isMobile) window.EJS_browserMode = 'mobile';
        
        window.EJS_buttons = { l: true, r: true, l2: true, r2: true, l3: true, r3: true, leftStick: true, rightStick: true, select: true, start: true };

        if (game.system === 'psx' || game.system === 'play') {
            const bios = await db.config.get('ps_bios');
            if (bios) window.EJS_biosUrl = URL.createObjectURL(bios.blob);
            window.EJS_defaultControllerType = 5; 
        }

        // Загружаем лоадер с другого надежного источника
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/loader.js';
        script.onerror = () => alert("Ошибка загрузки эмулятора. Проверьте интернет или попробуйте VPN.");
        document.body.appendChild(script);
    }

    async function deleteGame(e, id) { e.stopPropagation(); if(confirm("Удалить?")) { await db.games.delete(id); renderGames(); } }
    async function addBios(event) { if (event.target.files[0]) { await db.config.put({ name: 'ps_bios', blob: event.target.files[0] }); location.reload(); } }
    function stopEmulator() { location.reload(); }
    function toggleFullScreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
    function filterSystem(sys, btn) { document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active-filter')); btn.classList.add('active-filter'); renderGames(sys); }
    renderGames();
</script>
</body>
</html>
