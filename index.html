<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RetroCloud Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Inter:wght@300;600&display=swap');
        
        body { background: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .font-brand { font-family: 'Orbitron', sans-serif; }
        
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .filter-btn { transition: all 0.2s; border: 1px solid transparent; }
        .active-btn { background: #2563eb !important; border-color: #60a5fa !important; box-shadow: 0 0 20px rgba(37, 99, 235, 0.4); }
        
        .game-card { transition: 0.4s cubic-bezier(0.23, 1, 0.32, 1); }
        .game-card:hover { transform: translateY(-10px) scale(1.02); border-color: #3b82f6; }
        
        #emulator-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; background: #000; }
        .btn-exit { position: absolute; top: 20px; right: 20px; z-index: 1001; background: rgba(239, 68, 68, 0.8); padding: 8px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        /* Стили скролла */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body>

<div id="ui-layer" class="p-6 md:p-12 max-w-[1600px] mx-auto">
    <!-- Header -->
    <header class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-8 mb-12">
        <div>
            <h1 class="text-6xl font-brand font-black tracking-tighter text-white">
                RETRO<span class="text-blue-500">CLOUD</span>
            </h1>
            <div id="bios-status" class="mt-3 inline-flex items-center gap-2 px-3 py-1 rounded-md bg-red-500/10 border border-red-500/20 text-red-400 text-[10px] font-bold uppercase tracking-widest">
                <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> PS1 BIOS missing
            </div>
        </div>

        <div class="flex flex-wrap gap-4">
            <button onclick="document.getElementById('biosInput').click()" class="glass px-5 py-3 rounded-xl text-sm font-semibold hover:bg-white/5 transition">⚙️ Настроить BIOS</button>
            <button onclick="document.getElementById('fileInput').click()" class="bg-blue-600 hover:bg-blue-500 px-10 py-4 rounded-2xl font-black text-lg shadow-xl shadow-blue-900/20 transition-all transform active:scale-95">
                ДОБАВИТЬ ИГРУ
            </button>
        </div>
    </header>

    <!-- Фильтры консолей -->
    <div class="space-y-6 mb-12">
        <div class="flex flex-col gap-2">
            <span class="text-[11px] font-bold text-slate-500 uppercase tracking-widest">Системы</span>
            <div class="flex gap-3 overflow-x-auto pb-2 no-scrollbar">
                <button onclick="filterSystem('all', this)" class="filter-btn active-btn glass px-6 py-2 rounded-xl text-sm">ВСЕ</button>
                <button onclick="filterSystem('nes', this)" class="filter-btn glass px-6 py-2 rounded-xl text-sm">NES</button>
                <button onclick="filterSystem('snes', this)" class="filter-btn glass px-6 py-2 rounded-xl text-sm">SNES</button>
                <button onclick="filterSystem('gba', this)" class="filter-btn glass px-6 py-2 rounded-xl text-sm text-green-400">GBA</button>
                <button onclick="filterSystem('segaMD', this)" class="filter-btn glass px-6 py-2 rounded-xl text-sm text-blue-300">Sega</button>
                <button onclick="filterSystem('psx', this)" class="filter-btn glass px-6 py-2 rounded-xl text-sm text-indigo-400">PlayStation</button>
                <button onclick="filterSystem('n64', this)" class="filter-btn glass px-6 py-2 rounded-xl text-sm text-red-400">N64</button>
                <button onclick="filterSystem('dos', this)" class="filter-btn glass px-6 py-2 rounded-xl text-sm text-orange-400">MS-DOS</button>
                <button onclick="filterSystem('mame', this)" class="filter-btn glass px-6 py-2 rounded-xl text-sm text-yellow-500">Arcade</button>
            </div>
        </div>
    </div>

    <!-- Сетка игр -->
    <div id="game-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-8">
        <!-- Игры подгрузятся сюда -->
    </div>

    <!-- Инпуты -->
    <input type="file" id="fileInput" class="hidden" multiple onchange="addGames(event)">
    <input type="file" id="biosInput" class="hidden" onchange="addBios(event)">
</div>

<!-- Окно эмулятора -->
<div id="emulator-container">
    <div class="btn-exit" onclick="stopEmulator()">ЗАКРЫТЬ</div>
    <div id="game" style="width:100%; height:100%;"></div>
</div>

<script>
    // 1. Инициализация Базы Данных
    const db = new Dexie("RetroCloudDB");
    db.version(1).stores({
        games: '++id, title, system, romBlob, cover',
        system: 'name, blob'
    });

    // 2. Карта форматов
    const systemMap = {
        'nes': 'nes', 'sfc': 'snes', 'smc': 'snes', 'snes': 'snes',
        'md': 'segaMD', 'gen': 'segaMD', 'bin': 'psx', 'chd': 'psx',
        'gba': 'gba', 'gbc': 'gbc', 'gb': 'gb', 'n64': 'n64', 'z64': 'n64',
        'zip': 'dos', // Для DOS (архив)
        'exe': 'dos', 'com': 'dos',
        'nds': 'nds', 'sms': 'segaMS', 'gg': 'segaGG'
    };

    // 3. Проверка BIOS
    async function checkBios() {
        const bios = await db.system.get('ps1_bios');
        const badge = document.getElementById('bios-status');
        if (bios) {
            badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-green-500"></span> PS1 BIOS Ready';
            badge.className = "mt-3 inline-flex items-center gap-2 px-3 py-1 rounded-md bg-green-500/10 border border-green-500/20 text-green-400 text-[10px] font-bold uppercase tracking-widest";
        }
    }

    async function addBios(event) {
        const file = event.target.files[0];
        if (file) {
            await db.system.put({ name: 'ps1_bios', blob: file });
            checkBios();
            alert("BIOS успешно загружен в память браузера!");
        }
    }

    // 4. Добавление игр
    async function addGames(event) {
        const files = Array.from(event.target.files);
        for (const file of files) {
            const ext = file.name.split('.').pop().toLowerCase();
            const system = systemMap[ext] || 'nes';
            const title = file.name.replace(/\.[^/.]+$/, "");<!--citation:1-->
            
            // Автоматическая обложка (заглушка с текстом)
            const cover = `https://via.placeholder.com/400x600/1e293b/ffffff?text=${encodeURIComponent(title)}`;
            
            await db.games.add({ title, system, romBlob: file, cover });
        }
        renderGames();
    }

    // 5. Отрисовка библиотеки
    async function renderGames(filter = 'all') {
        const grid = document.getElementById('game-grid');
        grid.innerHTML = '';
        const games = await db.games.toArray();
        const filtered = filter === 'all' ? games : games.filter(g => g.system === filter);<!--citation:2-->

        if (filtered.length === 0) {
            grid.innerHTML = `<div class="col-span-full py-20 text-center text-slate-500 font-medium">Здесь пока пусто. Добавьте свои первые ROM-файлы!</div>`;
        }

        filtered.forEach(game => {
            const card = document.createElement('div');
            card.className = 'game-card glass rounded-3xl overflow-hidden cursor-pointer flex flex-col group relative border border-transparent hover:border-blue-500/50';
            card.innerHTML = `
                <div class="relative aspect-[3/4] bg-slate-900 overflow-hidden">
                    <img src="${game.cover}" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition duration-500 group-hover:scale-110">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-transparent opacity-60"></div>
                    <div class="absolute bottom-4 left-4 right-4">
                        <span class="text-[9px] font-black bg-blue-600 text-white px-2 py-1 rounded-md uppercase tracking-tighter">${game.system}</span>
                        <div class="mt-2 text-sm font-bold truncate leading-tight">${game.title}</div>
                    </div>
                </div>
            `;
            card.onclick = () => startEmulator(game);
            grid.appendChild(card);
        });
    }

    // 6. Запуск Эмулятора
    async function startEmulator(game) {
        document.getElementById('emulator-container').style.display = 'block';
        document.getElementById('ui-layer').style.display = 'none';

        const romUrl = URL.createObjectURL(game.romBlob);
        window.EJS_player = '#game';
        window.EJS_gameUrl = romUrl;
        window.EJS_core = game.system; // 'dos', 'psx', 'nes' и т.д.
        window.EJS_pathtodata = 'https://rawcdn.githack.com/EmulatorJS/EmulatorJS/main/data/';
        window.EJS_startOnLoad = true;

        // Настройки BIOS для PS1
        if (game.system === 'psx') {
            const bios = await db.system.get('ps1_bios');
            if (bios) window.EJS_biosUrl = URL.createObjectURL(bios.blob);
        }

        // Если это DOS, эмулятор сам предложит меню выбора EXE из ZIP
        window.EJS_settings = {
            gamepad: true,
            saveState: true,
            loadState: true,
            fullScreen: true
        };

        const script = document.createElement('script');
        script.src = 'https://rawcdn.githack.com/EmulatorJS/EmulatorJS/main/data/loader.js';
        
        script.onload = () => {
            // Принудительный фокус для работы клавиатуры
            setTimeout(() => {
                const canvas = document.querySelector('canvas');
                if(canvas) canvas.focus();
            }, 1500);
        };
        
        document.body.appendChild(script);
    }

    function stopEmulator() {
        if(confirm("Вернуться в меню? Убедитесь, что вы сохранили прогресс в эмуляторе.")) location.reload();
    }

    function filterSystem(sys, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active-btn'));
        btn.classList.add('active-btn');
        renderGames(sys);
    }

    // Загрузка при старте
    checkBios();
    renderGames();
</script>

</body>
</html>
