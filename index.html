<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RetroStation 5</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        
        :root { --ps-blue: #00439c; --accent: #00439c; --bg: #07101d; }

        /* ТЕМЫ */
        body.theme-ps5 { --accent: #00439c; --bg: #07101d; }
        body.theme-switch { --accent: #e60012; --bg: #2d2d2d; }
        body.theme-xbox { --accent: #107c10; --bg: #050505; }

        *{box-sizing:border-box}
        html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:'Inter', sans-serif;color:#fff}
        
        body { background: var(--bg); transition: background 0.5s ease; }

        /* Фоновые градиенты PS5 из твоего кода */
        body.theme-ps5:before {
            content:""; position:fixed; inset:0;
            background: radial-gradient(circle at 75% 40%,rgba(40,115,190,.42),transparent 32%),
                        linear-gradient(115deg,rgba(0,0,0,.94) 0%,rgba(0,0,0,.5) 43%,rgba(4,18,35,.2) 100%);
            z-index:-2;
        }
        body.theme-ps5:after {
            content:""; position:fixed; inset:0;
            background:linear-gradient(90deg,rgba(0,0,0,.72),transparent 45%,rgba(0,0,0,.25));
            z-index:-1;
        }

        /* Top Navigation */
        .top { height:82px; display:flex; align-items:center; padding:0 4.5vw; gap:55px; font-size:20px; z-index:100; position:relative; }
        .nav { opacity:.48; cursor:pointer; transition:0.3s; }
        .nav.active { opacity:1; font-weight:600; }
        .logo { width:45px; height:45px; border:2px solid #fff; border-radius:50%; display:grid; place-items:center; font-size:22px; transform:rotate(-18deg); font-weight:bold; }
        .top-icons { margin-left:auto; display:flex; gap:25px; align-items:center; font-size:20px; }
        .avatar { width:35px; height:35px; border-radius:50%; background:linear-gradient(#444,#111); border:2px solid #ddd; cursor:pointer; }

        /* Game Row */
        .games-row { display:flex; align-items:center; gap:12px; padding:30px 8vw 0; height:160px; overflow-x: auto; scrollbar-width: none; }
        .games-row::-webkit-scrollbar { display: none; }
        
        .tile {
            width:85px; height:85px; border-radius:12px; background:rgba(20,27,39,.9);
            border:1px solid rgba(255,255,255,.08); display:grid; place-items:center;
            font-size:30px; box-shadow:0 5px 20px #0008; flex:none; cursor:pointer;
            transition: all 0.3s cubic-bezier(0,0,0,1); overflow: hidden;
        }
        .tile img { width: 100%; height: 100%; object-fit: cover; }
        
        .tile.selected {
            width:135px; height:135px; border-radius:18px;
            border:3px solid #eee; background:linear-gradient(135deg,#0879d8,#10172d);
            box-shadow:0 0 0 2px #111, 0 15px 40px #000;
        }

        .game-title-display { margin-left:9vw; margin-top:10px; font-size:22px; color:#fff; font-weight:bold; height: 30px; }

        /* Content Area */
        .content { position:absolute; left:8.5vw; bottom:12vh; width:48%; animation: fadeIn 0.5s ease; }
        .brand { font-size:62px; font-weight:900; letter-spacing:-2px; text-transform: uppercase; line-height: 0.9; }
        .subtitle { font-size:20px; margin:20px 0 30px; color:#ccc; }
        .actions { display:flex; align-items:center; gap:20px; }
        .play-btn { font-size:22px; font-weight:bold; padding:14px 50px; border-radius:50px; background:#fff; color:#000; transition:.2s; cursor:pointer; }
        .play-btn:hover { transform: scale(1.05); background: var(--accent); color: white; }

        /* Info Card */
        .info-card {
            position:absolute; right:7vw; bottom:13vh; width:280px;
            background:rgba(255,255,255,0.05); backdrop-filter:blur(15px);
            border-radius: 4px; overflow:hidden; border: 1px solid rgba(255,255,255,0.1);
        }
        .card-cover { height:160px; background:linear-gradient(135deg,#0759c8,#111d55); display:flex; align-items:center; justify-content:center; text-align:center; font-weight:900; padding:20px; }
        .card-body { padding:15px; }
        .progress-box { padding:15px; background:rgba(0,0,0,0.3); display:flex; justify-content:space-between; align-items:center; }

        /* Theme Selector Overlay */
        .theme-tray { position: fixed; top: 100px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 200; }
        .theme-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid white; cursor: pointer; }

        #emulator-container { display: none; position: fixed; inset: 0; z-index: 9999; background: #000; }

        /* PlayStation Symbols */
        .is-psx [data-button]::after { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: white !important; font-size: 24px; visibility: visible; font-weight: 900; }
        .is-psx [data-button="a"]::after { content: "✖"; color: #88aaff !important; }
        .is-psx [data-button="b"]::after { content: "●"; color: #ff8888 !important; }
        .is-psx [data-button="x"]::after { content: "■"; color: #ffcc88 !important; }
        .is-psx [data-button="y"]::after { content: "▲"; color: #88ff88 !important; }
        .is-psx [data-button] { color: transparent !important; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media(max-width:800px){
            .brand { font-size: 35px; }
            .info-card { display: none; }
            .top { gap: 20px; }
            .content { width: 80%; }
        }
    </style>
</head>
<body class="theme-ps5" onclick="unlockAudio()">

<div id="ui-layer">
    <!-- Header -->
    <header class="top">
        <div class="logo">PS</div>
        <div class="nav active" onclick="setFilter('all', this)">Игры</div>
        <div class="nav" onclick="setFilter('favorite', this)">Медиа</div>
        <div class="top-icons">
            <span onclick="document.getElementById('fileInput').click()" style="cursor:pointer">🔍</span>
            <span onclick="document.getElementById('biosInput').click()" style="cursor:pointer">⚙️</span>
            <div class="avatar" onclick="exportLibrary()"></div>
            <span class="time" id="time">00:00</span>
        </div>
    </header>

    <!-- Game Tiles -->
    <section class="games-row" id="game-grid">
        <!-- Кнопка Store / Добавить -->
        <div class="tile" onclick="document.getElementById('fileInput').click()">
            <span style="font-size: 40px;">+</span>
        </div>
    </section>

    <div class="game-title-display" id="active-game-title-bottom">PlayStation Store</div>

    <!-- Content Area -->
    <main class="content">
        <div class="brand" id="active-game-title-large">RETRO STATION</div>
        <div class="subtitle" id="active-game-system">Выберите игру, чтобы начать</div>
        <div class="actions">
            <div class="play-btn" id="main-play-btn">Играть</div>
            <div class="more" onclick="deleteActiveGame()" style="cursor:pointer; opacity: 0.5;">🗑️</div>
        </div>
    </main>

    <!-- Info Card -->
    <aside class="info-card" id="side-card">
        <div class="card-cover" id="card-art">RS5</div>
        <div class="card-body">
            <span class="bg-white text-black px-2 py-1 text-[10px] font-bold mb-2 inline-block uppercase" id="card-badge">Full Game</span>
            <div class="text-sm font-bold" id="card-status">Готов к запуску</div>
        </div>
        <div class="progress-box">
            <div>🏆</div>
            <div class="text-right"><span class="block opacity-50 text-[10px]">Трофеи</span><strong>0/50</strong></div>
        </div>
    </aside>
</div>

<!-- Theme Dots -->
<div class="theme-tray">
    <div class="theme-dot bg-blue-600" onclick="changeTheme('ps5')"></div>
    <div class="theme-dot bg-red-600" onclick="changeTheme('switch')"></div>
    <div class="theme-dot bg-green-600" onclick="changeTheme('xbox')"></div>
</div>

<div id="emulator-container">
    <button onclick="stopEmulator()" class="absolute top-8 left-8 z-[10000] glass px-8 py-3 rounded-full font-black uppercase text-sm">Выйти</button>
    <div id="game" style="width:100%; height:100%;"></div>
</div>

<input type="file" id="fileInput" class="hidden" multiple onchange="addGames(event)">
<input type="file" id="biosInput" class="hidden" onchange="addBios(event)">

<script>
    const db = new Dexie("RetroPS5UltimateStore");
    db.version(1).stores({ games: '++id, title, system, romBlob, isFavorite, cover' });

    let activeGame = null;
    let audioUnlocked = false;

    // Звуки с твоего GitHub
    const AudioEngine = {
        ps5: { nav: 'ps5_nav.mp3', start: 'ps5_start.mp3' },
        switch: { nav: 'switch_nav.mp3', start: 'switch_nav.mp3' },
        xbox: { nav: 'xbox_nav.mp3', start: 'xbox_start.mp3' }
    };

    function unlockAudio() { audioUnlocked = true; }
    function playSfx(type) {
        if (!audioUnlocked) return;
        const theme = document.body.className.replace('theme-', '');
        new Audio(AudioEngine[theme][type]).play().catch(()=>{});
    }

    // --- Core Logic ---
    async function renderGames() {
        const grid = document.getElementById('game-grid');
        const storeTile = grid.firstElementChild;
        grid.innerHTML = '';
        grid.appendChild(storeTile);

        const games = await db.games.toArray();
        games.reverse().forEach((game, index) => {
            const card = document.createElement('div');
            card.className = `tile ${index === 0 ? 'selected' : ''}`;
            if(index === 0) focusGame(game);

            card.innerHTML = `<img src="${game.cover}" onerror="this.style.display='none'"><span>${game.cover ? '' : game.title.substring(0,1)}</span>`;
            
            card.onclick = () => {
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('selected'));
                card.classList.add('selected');
                focusGame(game);
                playSfx('nav');
            };
            grid.appendChild(card);
        });
    }

    function focusGame(game) {
        activeGame = game;
        document.getElementById('active-game-title-bottom').innerText = game.title;
        document.getElementById('active-game-title-large').innerText = game.title;
        document.getElementById('active-game-system').innerText = game.system.toUpperCase();
        document.getElementById('card-art').innerText = game.title;
        document.getElementById('main-play-btn').onclick = () => startEmulator(game.id);
    }

    async function addGames(event) {
        const systemMap = { 'nes':'nes','snes':'snes','gba':'gba','gb':'gb','gbc':'gbc','md':'segaMD','bin':'psx','iso':'psx','nds':'nds' };
        for (const file of event.target.files) {
            const ext = file.name.split('.').pop().toLowerCase();
            const title = file.name.replace(/\.[^/.]+$/, "");
            const coverUrl = `https://raw.githubusercontent.com/libretro-thumbnails/libretro-thumbnails/master/Sony_-_PlayStation/Named_Boxarts/${encodeURIComponent(title)}.png`;
            await db.games.add({ title, system: systemMap[ext] || 'nes', romBlob: file, isFavorite: 0, cover: coverUrl });
        }
        renderGames();
    }

    async function startEmulator(id) {
        const game = await db.games.get(id);
        playSfx('start');
        document.getElementById('emulator-container').style.display = 'block';
        window.EJS_player = '#game';
        window.EJS_gameUrl = URL.createObjectURL(game.romBlob);
        window.EJS_core = game.system;
        window.EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/';
        window.EJS_startOnLoad = true;
        if (/Android|iPhone|iPad/i.test(navigator.userAgent)) window.EJS_browserMode = 'mobile';
        
        if (game.system.includes('ps') || game.system === 'play') {
            const bios = await db.config.get('ps_bios');
            if (bios) window.EJS_biosUrl = URL.createObjectURL(bios.blob);
            window.EJS_defaultControllerType = 5; 
            document.getElementById('emulator-container').classList.add('is-psx');
        }

        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/loader.js';
        document.body.appendChild(script);
    }

    // --- Helpers ---
    function changeTheme(theme) {
        document.body.className = 'theme-' + theme;
        localStorage.setItem('retro-theme', theme);
        playSfx('start');
    }

    function updateTime() {
        document.getElementById('time').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    }

    async function deleteActiveGame() {
        if(activeGame && confirm("Удалить игру из памяти?")) {
            await db.games.delete(activeGame.id);
            location.reload();
        }
    }

    function stopEmulator() { location.reload(); }
    async function exportLibrary() { const g = await db.games.toArray(); const b = new Blob([JSON.stringify(g)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `retro_backup.json`; a.click(); }

    updateTime(); setInterval(updateTime, 30000);
    renderGames();
</script>
</body>
</html>
