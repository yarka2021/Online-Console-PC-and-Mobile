<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RetroStation OS: Neural P2P</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Inter:wght@100;400;900&display=swap');
        :root { --neon: #00f2ff; --accent: #00439c; --bg: #000; }
        *{box-sizing:border-box; margin:0; padding:0; cursor: none !important;}
        body { background-color: #000; color: white; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; perspective: 2000px; }
        
        /* ТЕМЫ */
        body.theme-ps5 { --accent: #00439c; --bg: #07101d; }
        body.theme-switch { --accent: #e60012; --bg: #e0e0e0; color: #333; }
        body.theme-xbox { --accent: #107c10; --bg: #001b04; }
        body.theme-gamehub { --accent: #8b5cf6; --bg: #0f111a; }
        body.theme-wii { --accent: #00a8df; --bg: radial-gradient(circle at 50% 0%, #ffffff 0%, #edf0f2 45%, #d9dde0 100%); color: #73797d; }

        .ui-page { display: none; width: 100%; height: 100%; position: absolute; inset: 0; flex-direction: column; }
        .active-page { display: flex !important; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        .console-nav { display: flex; gap: 10px; overflow-x: auto; padding: 10px 40px; scrollbar-width: none; z-index: 1000; }
        .c-btn { padding: 8px 18px; border-radius: 20px; font-size: 10px; font-weight: 900; text-transform: uppercase; white-space: nowrap; transition: 0.3s; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: inherit; flex-shrink: 0; }
        .c-btn.active { background: var(--accent); color: white !important; border-color: white; box-shadow: 0 0 15px var(--accent); }

        #scroller { display: flex; align-items: center; height: 100%; transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1); transform-style: preserve-3d; }
        .omni-card { min-width: 300px; height: 420px; background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px; margin: 0 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.5s; }
        .omni-card.active { border-color: var(--neon); box-shadow: 0 0 80px rgba(0, 242, 255, 0.2); transform: translateZ(150px); }
        .omni-card img { width: 85%; height: 75%; object-fit: cover; border-radius: 20px; }

        .lobby-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; transition: 0.3s; position: relative; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }

        #custom-cursor { position: fixed; width: 30px; height: 30px; border: 1px solid var(--neon); border-radius: 50%; pointer-events: none; z-index: 1000000; display: flex; align-items: center; justify-content: center; transition: 0.1s linear; }
        #emulator-container { display: none; position: fixed; inset: 0; z-index: 200000; background: #000; }
        .theme-tray { position: fixed; top: 50%; right: 20px; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; z-index: 1500; }
        .theme-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; cursor: pointer; }

        /* Sony Symbols */
        .is-psx [data-button]::after { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: white !important; font-size: 24px; visibility: visible; font-weight: 900; }
        .is-psx [data-button="a"]::after { content: "✖"; color: #508dff !important; }
        .is-psx [data-button="b"]::after { content: "●"; color: #ff5050 !important; }
        .is-psx [data-button="x"]::after { content: "■"; color: #ffbc50 !important; }
        .is-psx [data-button="y"]::after { content: "▲"; color: #50ff7a !important; }
        .is-psx [data-button] { color: transparent !important; }

        @media screen and (max-width: 900px) and (orientation: portrait) { #rotate-overlay { display: flex !important; } }
        #rotate-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 1000000; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    </style>
</head>
<body class="theme-ps5" onclick="initAether()">

<div id="custom-cursor"></div>

<div id="rotate-overlay">
    <p class="font-bold uppercase tracking-widest animate-pulse">Пожалуйста, поверните телефон</p>
</div>

<div class="theme-tray">
    <div class="theme-dot bg-blue-600" onclick="changeTheme('ps5')"></div>
    <div class="theme-dot bg-red-600" onclick="changeTheme('switch')"></div>
    <div class="theme-dot bg-green-600" onclick="changeTheme('xbox')"></div>
    <div class="theme-dot bg-purple-600" onclick="changeTheme('gamehub')"></div>
    <div class="theme-dot bg-zinc-400" onclick="changeTheme('wii')"></div>
</div>

<!-- --- PAGE: HOME --- -->
<div id="page-home" class="ui-page active-page">
    <header class="flex justify-between items-center px-10 py-6">
        <div class="flex items-center gap-6">
            <div class="w-12 h-12 rounded-xl glass flex items-center justify-center font-black border-white/20">RS</div>
            <span id="user-display" class="font-black italic text-xl uppercase cursor-pointer" onclick="changeNick()">PLAYER ONE</span>
        </div>
        <div class="flex gap-4">
            <button onclick="switchPage('party')" class="glass px-6 py-2 rounded-full font-bold text-[10px] uppercase">🌐 Party Hub</button>
            <button onclick="document.getElementById('fileInput').click()" class="bg-white text-black px-6 py-2 rounded-full font-bold text-[10px] uppercase">+ Add</button>
        </div>
    </header>

    <div class="console-nav">
        <div onclick="setFilter('all', this)" class="c-btn active">Все</div>
        <div onclick="setFilter('psx', this)" class="c-btn">PS1</div>
        <div onclick="setFilter('play', this)" class="c-btn">PS2</div>
        <div onclick="setFilter('gba', this)" class="c-btn">GBA</div>
        <div onclick="setFilter('nes', this)" class="c-btn">NES</div>
        <div onclick="setFilter('dos', this)" class="c-btn">DOS</div>
    </div>

    <div id="scroller-container"><div id="scroller"></div></div>

    <div class="px-20 py-8 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-black italic uppercase" id="hud-title">RetroStation</h1>
            <p id="voice-status" class="text-[9px] opacity-40 uppercase tracking-widest italic">P2P Multi-Link System Ready</p>
        </div>
        <button onclick="launchCurrent()" class="bg-cyan-500 text-black px-12 py-3 rounded-full font-black uppercase text-sm hover:scale-110 transition">Запустить</button>
    </div>
</div>

<!-- --- PAGE: PARTY HUB --- -->
<div id="page-party" class="ui-page">
    <header class="flex justify-between items-center px-10 py-6">
        <h1 class="text-3xl font-black italic tracking-tighter uppercase">Party<span class="text-cyan-400">Hub</span></h1>
        <button onclick="switchPage('home')" class="glass px-6 py-2 rounded-full font-bold text-[10px] uppercase">🏠 Назад</button>
    </header>

    <main class="flex-1 px-10 py-4">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="lobby-list">
            <!-- Твой статус -->
            <div class="lobby-card border-cyan-500/50 border-2">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 bg-cyan-500 rounded-full flex items-center justify-center font-bold text-black">YOU</div>
                    <p class="font-bold uppercase" id="my-name">PLAYER ONE</p>
                    <span class="status-dot bg-green-500 ml-auto"></span>
                </div>
                <button onclick="shareLobby()" class="w-full py-2 bg-cyan-500 text-black rounded-lg text-xs font-black uppercase">Пригласить друга 🔗</button>
            </div>
            <!-- Сюда PeerJS добавит карточки друзей -->
        </div>
    </main>
</div>

<div id="emulator-container">
    <div id="game" style="width:100%; height:100%;"></div>
    <button onclick="location.reload()" class="absolute top-5 right-5 glass px-6 py-2 rounded-full font-black uppercase text-[10px]">EXIT</button>
</div>

<input type="file" id="fileInput" class="hidden" multiple onchange="importGames(event)">

<script>
    const db = new Dexie("RetroP2P_DB");
    db.version(1).stores({ games: '++id, title, system, romBlob, cover', settings: 'key, val' });

    let games = [], filteredGames = [], currentIndex = 0, audioUnlocked = false, userNick = "PLAYER ONE";
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    
    // --- REAL P2P ENGINE (PeerJS) ---
    let peer, connections = {}, roomID = new URLSearchParams(window.location.search).get('room');

    function initP2P() {
        // Создаем Peer с уникальным ID для этой сессии
        peer = new Peer('RS-' + Math.random().toString(36).substr(2, 9));
        
        peer.on('open', (id) => {
            console.log('My P2P ID is: ' + id);
            if (roomID) connectToHost(roomID);
        });

        peer.on('connection', (conn) => {
            setupConnection(conn);
        });
    }

    function setupConnection(conn) {
        conn.on('data', (data) => {
            if (data.type === 'hello') {
                updateFriendList(conn.peer, data.nick);
                // Отвечаем своим ником
                conn.send({ type: 'hello-back', nick: userNick });
            }
            if (data.type === 'hello-back') {
                updateFriendList(conn.peer, data.nick);
            }
        });
        
        conn.on('open', () => {
            conn.send({ type: 'hello', nick: userNick });
        });
    }

    function connectToHost(hostID) {
        const conn = peer.connect(hostID);
        setupConnection(conn);
    }

    function updateFriendList(id, nick) {
        const list = document.getElementById('lobby-list');
        const existing = document.getElementById('peer-' + id);
        if (existing) return;

        const card = document.createElement('div');
        card.id = 'peer-' + id;
        card.className = 'lobby-card';
        card.innerHTML = `
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center font-bold">👤</div>
                <div>
                    <p class="font-bold uppercase">${nick}</p>
                    <p class="text-[9px] text-green-400 font-bold uppercase">В СЕТИ</p>
                </div>
                <span class="status-dot bg-green-500 ml-auto"></span>
            </div>
        `;
        list.appendChild(card);
        speak(`${nick} вошел в лобби.`);
    }

    function shareLobby() {
        const link = window.location.origin + window.location.pathname + "?room=" + peer.id;
        navigator.clipboard.writeText(link);
        alert("Ссылка скопирована! Отправь её другу, и вы увидите друг друга в Party Hub.");
    }

    // --- ОСНОВНАЯ ЛОГИКА ---
    function switchPage(id) {
        document.querySelectorAll('.ui-page').forEach(p => p.classList.remove('active-page'));
        document.getElementById('page-' + id).classList.add('active-page');
    }

    async function initAether() {
        if(audioUnlocked) return;
        audioUnlocked = true;
        const savedNick = await db.settings.get("nickname");
        if(savedNick) userNick = savedNick.val;
        document.getElementById('user-display').innerText = userNick;
        document.getElementById('my-name').innerText = userNick;
        initP2P();
        renderLibrary();
    }

    async function renderLibrary() {
        games = await db.games.toArray();
        filteredGames = currentFilter === 'all' ? games : games.filter(g => g.system === currentFilter);
        const scroller = document.getElementById('scroller');
        scroller.innerHTML = filteredGames.length ? '' : `<div class="omni-card active text-center p-10 font-black italic uppercase">NO DATA</div>`;
        filteredGames.reverse().forEach((g, i) => {
            const card = document.createElement('div');
            card.className = `omni-card ${i === currentIndex ? 'active' : ''}`;
            card.innerHTML = `<img src="${g.cover}" onerror="this.src='https://via.placeholder.com/300x450/000/fff?text=${g.title}'"><div class="mt-6 text-center"><p class="text-[8px] font-black text-cyan-400 uppercase">${g.system}</p><h2 class="text-xl font-black italic uppercase tracking-tighter">${g.title}</h2></div>`;
            card.onclick = () => { if(i === currentIndex) launchCurrent(); else { currentIndex = i; updateSelection(); } };
            scroller.appendChild(card);
        });
        currentIndex = 0; updateSelection();
    }

    function updateSelection() {
        const offset = window.innerWidth / 2 - (currentIndex * 420) - 160;
        document.getElementById('scroller').style.transform = `translateX(${offset}px)`;
        document.querySelectorAll('.omni-card').forEach((c, i) => {
            const dist = Math.abs(i - currentIndex);
            c.classList.toggle('active', i === currentIndex);
            c.style.opacity = dist > 2 ? 0 : (1 - dist * 0.4);
            c.style.transform = `rotateY(${(i - currentIndex) * -30}deg) scale(${i === currentIndex ? 1.15 : 0.75})`;
        });
        if(filteredGames[currentIndex]) document.getElementById('hud-title').innerText = filteredGames[currentIndex].title;
    }

    async function importGames(event) {
        for (const file of event.target.files) {
            const ext = file.name.split('.').pop().toLowerCase();
            const title = file.name.replace(/\.[^/.]+$/, "");
            const cover = `https://raw.githubusercontent.com/libretro-thumbnails/libretro-thumbnails/master/Sony_-_PlayStation/Named_Boxarts/${encodeURIComponent(title)}.png`;
            await db.games.add({ title, system: (ext==='bin'||ext==='iso'?'psx':'nes'), romBlob: file, cover });
        }
        renderLibrary();
    }

    async function launchCurrent() {
        const game = filteredGames[currentIndex];
        if(!game) return;
        document.getElementById('emulator-container').style.display = 'block';
        window.EJS_player = '#game';
        window.EJS_gameUrl = URL.createObjectURL(game.romBlob);
        window.EJS_core = game.system;
        window.EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/';
        window.EJS_startOnLoad = true;
        window.EJS_netplayNickname = userNick;
        if(isMobile) window.EJS_browserMode = 'mobile';
        if (game.system.includes('ps')) document.getElementById('emulator-container').classList.add('is-psx');
        const script = document.createElement('script');
        script.src = 'https://rawcdn.githack.com/EmulatorJS/EmulatorJS/main/data/loader.js';
        document.body.appendChild(script);
    }

    function changeTheme(t) { document.body.className = 'theme-' + t; if(!isMobile) document.body.classList.add('is-pc'); localStorage.setItem('retro-theme', t); }
    function setFilter(s, b) { currentFilter = s; document.querySelectorAll('.c-btn').forEach(x => x.classList.remove('active')); b.classList.add('active'); renderLibrary(); }
    function speak(text) { if (audioUnlocked) window.speechSynthesis.speak(new SpeechSynthesisUtterance(text)); }
    function changeNick() { const n = prompt("Ваш ник:"); if(n) { userNick = n.toUpperCase(); document.getElementById('user-display').innerText = userNick; db.settings.put({key:"nickname", val:userNick}); } }
    
    document.addEventListener('mousemove', e => {
        const c = document.getElementById('custom-cursor');
        c.style.left = e.clientX - 15 + 'px'; c.style.top = e.clientY - 15 + 'px';
    });

    changeTheme(localStorage.getItem('retro-theme') || 'ps5');
    setInterval(() => { if(document.querySelector('.clock-text')) document.querySelectorAll('.clock-text').forEach(el => el.innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})); }, 1000);
</script>
</body>
</html>
