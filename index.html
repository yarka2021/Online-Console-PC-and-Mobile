<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RetroCloud Multi-Console</title>
    
    <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
    <script src="https://unpkg.com/nostalgist/dist/nostalgist.umd.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #080808;
            --panel: #121212;
            --accent: #00f2ff;
            --text: #ffffff;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--text); 
            font-family: 'Segoe UI', sans-serif; overflow: hidden; 
        }

        /* ШАПКА */
        header { 
            background: #000; padding: 15px 20px; 
            display: flex; align-items: center; 
            border-bottom: 2px solid var(--accent);
            justify-content: space-between;
        }
        .logo { font-family: 'Orbitron', sans-serif; color: var(--accent); font-size: 18px; cursor: pointer; }

        /* ЭКРАНЫ */
        .screen { display: none; height: calc(100% - 60px); overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .active { display: block; }

        /* СЕТКА КОНСОЛЕЙ */
        .console-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px; max-width: 1000px; margin: 0 auto;
        }
        .console-card {
            background: var(--panel); border-radius: 15px; padding: 30px 10px;
            text-align: center; border: 1px solid #222; transition: 0.3s; cursor: pointer;
        }
        .console-card:hover { border-color: var(--accent); transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,242,255,0.2); }
        .console-card i { font-size: 40px; display: block; margin-bottom: 10px; font-style: normal; }
        .console-card span { font-weight: bold; font-family: 'Orbitron'; font-size: 14px; }

        /* СПИСОК ИГР */
        .game-list {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
        }
        .game-item {
            background: var(--panel); border-radius: 8px; overflow: hidden; cursor: pointer; border: 1px solid #222;
        }
        .game-item img { width: 100%; aspect-ratio: 1; object-fit: cover; }
        .game-item .name { padding: 8px; font-size: 11px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* ЭМУЛЯТОР */
        #emu-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; display: none; }
        .exit-btn { position: absolute; top: 10px; right: 10px; z-index: 1100; background: rgba(255,0,0,0.6); color: white; border: none; padding: 10px; border-radius: 5px; }

        /* МОБИЛЬНЫЕ КНОПКИ */
        .touch-overlay {
            position: absolute; bottom: 20px; left: 0; width: 100%;
            display: none; justify-content: space-between; padding: 20px;
            box-sizing: border-box; pointer-events: none;
        }
        .t-btn {
            width: 60px; height: 60px; background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3); border-radius: 50%;
            pointer-events: auto; display: flex; align-items: center; justify-content: center;
            color: white; user-select: none; backdrop-filter: blur(5px);
        }
        .t-btn:active { background: var(--accent); color: #000; }
        .dpad { display: grid; grid-template-columns: repeat(3, 50px); }
        .actions { display: flex; gap: 10px; align-items: flex-end; }

        .add-fab { 
            position: fixed; bottom: 30px; right: 30px; 
            background: var(--accent); width: 60px; height: 60px; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: black; font-size: 30px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<header>
    <div class="logo" onclick="showScreen('main')">RETRO CLOUD</div>
    <div id="nav-title" style="font-size: 12px; color: #888;">ВЫБЕРИТЕ КОНСОЛЬ</div>
</header>

<!-- ЭКРАН 1: ВЫБОР КОНСОЛИ -->
<div id="main" class="screen active">
    <div class="console-grid">
        <div class="console-card" onclick="openConsole('nes')"><i>🎮</i><span>NES</span></div>
        <div class="console-card" onclick="openConsole('snes')"><i>🕹️</i><span>SNES</span></div>
        <div class="console-card" onclick="openConsole('gba')"><i>📟</i><span>GBA</span></div>
        <div class="console-card" onclick="openConsole('gbc')"><i>🌈</i><span>GBC</span></div>
        <div class="console-card" onclick="openConsole('sega')"><i>🦔</i><span>SEGA</span></div>
        <div class="console-card" onclick="openConsole('ps1')"><i>💿</i><span>PS1</span></div>
        <div class="console-card" onclick="openConsole('n64')"><i>🧊</i><span>N64</span></div>
    </div>
</div>

<!-- ЭКРАН 2: СПИСОК ИГР В КОНСОЛИ -->
<div id="console-view" class="screen">
    <div class="game-list" id="game-list"></div>
    <div class="add-fab" onclick="document.getElementById('file-input').click()">+</div>
</div>

<!-- ЭКРАН 3: ЭМУЛЯТОР -->
<div id="emu-view">
    <button class="exit-btn" onclick="closeGame()">ВЫЙТИ</button>
    <div id="player" style="width:100%; height:100%;"></div>
    
    <div id="touch-controls" class="touch-overlay">
        <div class="dpad">
            <div></div><div class="t-btn" id="up">↑</div><div></div>
            <div class="t-btn" id="left">←</div><div></div><div class="t-btn" id="right">→</div>
            <div></div><div class="t-btn" id="down">↓</div><div></div>
        </div>
        <div class="actions">
            <div class="t-btn" id="start" style="width:40px;height:40px;font-size:10px">STR</div>
            <div class="t-btn" id="b">B</div>
            <div class="t-btn" id="a">A</div>
        </div>
    </div>
</div>

<input type="file" id="file-input" hidden onchange="addNewGame(event)">

<script>
    const db = new Dexie("RetroCloudDB");
    db.version(1).stores({ games: '++id, type, name, data, cover' });

    let currentPlatform = '';
    let emulator = null;

    // Навигация
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'main') document.getElementById('nav-title').innerText = 'ВЫБЕРИТЕ КОНСОЛЬ';
    }

    async function openConsole(type) {
        currentPlatform = type;
        document.getElementById('nav-title').innerText = type.toUpperCase() + ' LIBRARY';
        showScreen('console-view');
        renderGames();
    }

    // Рендер игр
    async function renderGames() {
        const list = document.getElementById('game-list');
        list.innerHTML = '';
        const games = await db.games.where('type').equals(currentPlatform).toArray();

        games.forEach(g => {
            const item = document.createElement('div');
            item.className = 'game-item';
            item.onclick = () => startGame(g);
            item.innerHTML = `
                <img src="${g.cover}" onerror="this.src='https://via.placeholder.com/150x150/121212/00f2ff?text=${g.type}'">
                <div class="name">${g.name}</div>
            `;
            list.appendChild(item);
        });
    }

    // Добавление игры
    async function addNewGame(e) {
        const file = e.target.files[0];
        if(!file) return;

        const name = file.name.replace(/\.[^/.]+$/, "");
        const buffer = await file.arrayBuffer();
        
        // Авто-обложка (зависит от платформы для точности)
        const platformPaths = {
            nes: 'Nintendo_-_Nintendo_Entertainment_System',
            snes: 'Nintendo_-_Super_Nintendo_Entertainment_System',
            gba: 'Nintendo_-_Game_Boy_Advance',
            gbc: 'Nintendo_-_Game_Boy_Color',
            sega: 'Sega_-_Mega_Drive_-_Genesis',
            ps1: 'Sony_-_PlayStation',
            n64: 'Nintendo_-_Nintendo_64'
        };

        const cover = `https://raw.githubusercontent.com/libretro/libretro-thumbnails/master/${platformPaths[currentPlatform]}/Named_Boxarts/${encodeURIComponent(name)}.png`;

        await db.games.add({ type: currentPlatform, name, data: buffer, cover });
        renderGames();
    }

    // Запуск игры
    async function startGame(game) {
        document.getElementById('emu-view').style.display = 'block';
        const cores = {
            nes: 'fceumm', snes: 'snes9x', gba: 'mgba', gbc: 'gambatte',
            sega: 'genesis_plus_gx', ps1: 'pcsx_rearmed', n64: 'mupen64plus_next'
        };

        try {
            emulator = await nostalgist.Nostalgist.launch({
                core: cores[game.type],
                rom: new Blob([game.data]),
                element: document.querySelector('#player'),
                keyBindings: [
                    { b: 'z', a: 'x', start: 'enter', select: 'shift', l: 'q', r: 'e' }
                ]
            });

            if ('ontouchstart' in window) {
                document.getElementById('touch-controls').style.display = 'flex';
            }
            document.documentElement.requestFullscreen().catch(()=>{});
        } catch(e) {
            alert("Ошибка: этот эмулятор требует HTTPS или локальный сервер.");
            closeGame();
        }
    }

    function closeGame() {
        if(emulator) { emulator.exit(); emulator = null; }
        document.getElementById('emu-view').style.display = 'none';
        if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
    }

    // Блокировка контекстного меню на кнопках для тача
    document.querySelectorAll('.t-btn').forEach(btn => {
        btn.oncontextmenu = (e) => e.preventDefault();
    });
</script>
</body>
</html>
