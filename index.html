<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RetroStation: Switch Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        
        :root {
            --accent: #00439c;
            --bg: #000205;
            --radius: 12px;
        }

        /* --- ТЕМЫ --- */
        body.theme-ps5 { --accent: #00439c; --bg: #00050f; --radius: 12px; }
        body.theme-xbox { --accent: #107c10; --bg: #050505; --radius: 0px; }
        
        /* ГЛУБОКАЯ ТЕМА SWITCH */
        body.theme-switch { 
            --accent: #e60012; 
            --bg: #2d2d2d; 
            --radius: 0px; 
            background: #2d2d2d !important;
        }

        body { 
            background-color: var(--bg); 
            color: white; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            overflow: hidden; 
            user-select: none;
            transition: all 0.5s ease;
        }

        #bg-canvas { position: fixed; inset: 0; z-index: -1; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        /* Плитки Switch */
        .theme-switch .game-card {
            aspect-ratio: 1/1;
            border-radius: 2px;
            background: #444;
            border: 4px solid transparent;
            transition: 0.2s cubic-bezier(0,0,0,1);
        }
        .theme-switch .game-card:hover {
            transform: scale(1.1);
            border-color: #00edff;
            box-shadow: 0 0 0 8px rgba(0, 237, 255, 0.2);
            z-index: 100;
        }

        /* Нижние иконки Switch */
        .switch-footer-icon {
            width: 50px; height: 50px;
            border-radius: 50%;
            background: #eee;
            display: flex; align-items: center; justify-content: center;
            color: #2d2d2d; font-size: 20px;
            transition: 0.2s;
            border: 3px solid transparent;
        }
        .theme-switch .switch-footer-icon:hover {
            transform: translateY(-5px);
            border-color: #00edff;
            background: white;
        }

        /* Анимация появления */
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        #emulator-container { display: none; position: fixed; inset: 0; z-index: 9999; background: #000; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* Иконки кнопок PSX */
        .is-psx [data-button]::after { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: white !important; font-size: 24px; visibility: visible; font-weight: 900; }
        .is-psx [data-button="a"]::after { content: "✖"; color: #88aaff !important; }
        .is-psx [data-button="b"]::after { content: "●"; color: #ff8888 !important; }
        .is-psx [data-button="x"]::after { content: "■"; color: #ffcc88 !important; }
        .is-psx [data-button="y"]::after { content: "▲"; color: #88ff88 !important; }
        .is-psx [data-button] { color: transparent !important; }
    </style>
</head>
<body class="theme-ps5">

<canvas id="bg-canvas"></canvas>

<!-- Верхняя панель (Switch Style) -->
<div id="status-bar" class="fixed top-0 left-0 right-0 p-6 flex justify-between items-center z-50">
    <div class="flex items-center gap-4">
        <div id="user-profile" class="w-12 h-12 rounded-full border-2 border-white/20 overflow-hidden glass">
            <img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=Honor" alt="User">
        </div>
        <div id="switch-logo" class="hidden theme-switch-block flex items-center gap-2">
            <div class="bg-[#e60012] p-1 rounded-sm font-black text-xs">Switch</div>
        </div>
    </div>
    <div class="flex items-center gap-6 font-bold text-sm opacity-80">
        <span id="clock">12:00</span>
        <span class="text-xs">Wi-Fi</span>
        <div class="w-8 h-4 border-2 border-white/40 rounded-sm relative">
            <div class="absolute inset-0.5 bg-green-500 w-3/4"></div>
        </div>
    </div>
</div>

<div id="ui-layer" class="pt-24 pb-32 min-h-screen flex flex-col relative z-10">
    <!-- Титл и Поиск -->
    <div class="px-10 mb-8 flex justify-between items-end">
        <h2 id="section-title" class="text-3xl font-bold tracking-tight">Все игры</h2>
        <div class="flex gap-4 items-center">
            <div class="theme-selector flex gap-3 glass p-2 rounded-full">
                <button onclick="changeTheme('ps5')" class="w-6 h-6 rounded-full bg-[#00439c] border border-white/50"></button>
                <button onclick="changeTheme('switch')" class="w-6 h-6 rounded-full bg-[#e60012] border border-white/50"></button>
                <button onclick="changeTheme('xbox')" class="w-6 h-6 rounded-full bg-[#107c10] border border-white/50"></button>
            </div>
            <button onclick="document.getElementById('fileInput').click()" class="glass px-6 py-2 rounded-full font-bold text-xs uppercase">+ Добавить</button>
        </div>
    </div>

    <!-- Сетка игр (В режиме Switch это горизонтальный скролл) -->
    <div id="main-scroller" class="flex overflow-x-auto gap-4 px-10 py-10 no-scrollbar items-center min-h-[400px]">
        <div id="game-grid" class="flex gap-6 items-center">
            <!-- Игры -->
        </div>
    </div>

    <!-- Нижняя панель Switch -->
    <div id="switch-footer" class="fixed bottom-10 left-0 right-0 flex justify-center gap-8 z-50">
        <div onclick="setFilter('all', this)" class="switch-footer-icon" title="Все игры">🏠</div>
        <div onclick="setFilter('favorite', this)" class="switch-footer-icon" title="Избранное">⭐</div>
        <div onclick="setFilter('psx', this)" class="switch-footer-icon" title="PlayStation">🎮</div>
        <button onclick="exportLibrary()" class="switch-footer-icon" title="Backup">☁️</button>
        <div onclick="document.getElementById('biosInput').click()" class="switch-footer-icon" title="Settings">⚙️</div>
    </div>
</div>

<div id="emulator-container">
    <div class="absolute top-5 left-5 z-[10000]">
        <button onclick="stopEmulator()" class="glass px-8 py-3 rounded-full font-black text-white hover:bg-red-600 transition">ВЫЙТИ</button>
    </div>
    <div id="game" style="width:100%; height:100%;"></div>
</div>

<input type="file" id="fileInput" class="hidden" multiple onchange="addGames(event)">
<input type="file" id="biosInput" class="hidden" onchange="addBios(event)">

<script>
    const db = new Dexie("RetroFinalEmuStore");
    db.version(1).stores({ games: '++id, title, system, romBlob, isFavorite, cover', config: 'name, blob' });

    let currentFilter = 'all';
    const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);

    // --- Background Engine ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function initParticles() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        particles = [];
        const theme = document.body.className;
        let count = theme.includes('switch') ? 15 : 50;
        for(let i=0; i<count; i++) particles.push({ 
            x: Math.random() * canvas.width, 
            y: Math.random() * canvas.height, 
            size: theme.includes('switch') ? Math.random() * 100 + 50 : Math.random() * 2 + 1, 
            speedX: (Math.random()-0.5)*0.3, 
            speedY: (Math.random()-0.5)*0.3, 
            alpha: Math.random() * 0.2
        });
    }
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const theme = document.body.className;
        particles.forEach(p => {
            p.x += p.speedX; p.y += p.speedY;
            if(p.x > canvas.width + 100) p.x = -100;
            if(p.y > canvas.height + 100) p.y = -100;
            ctx.fillStyle = theme.includes('switch') ? `rgba(255,255,255,0.03)` : `rgba(255,255,255,${p.alpha})`;
            ctx.beginPath();
            if(theme.includes('xbox')) ctx.rect(p.x, p.y, p.size*3, p.size*3);
            else ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        });
        requestAnimationFrame(animate);
    }

    // --- UI Logic ---
    function changeTheme(theme) {
        document.body.className = 'theme-' + theme;
        localStorage.setItem('retro-theme', theme);
        initParticles();
        // Специальные настройки для Switch макета
        if(theme === 'switch') {
            document.getElementById('main-scroller').style.flexDirection = 'row';
        }
    }

    function updateClock() {
        const now = new Date();
        document.getElementById('clock').innerText = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
    }

    async function addGames(event) {
        for (const file of event.target.files) {
            const ext = file.name.split('.').pop().toLowerCase();
            const title = file.name.replace(/\.[^/.]+$/, "");
            const system = (ext === 'iso' && file.size > 500000000) ? 'play' : 'psx'; // Пример авто-детекта
            const coverUrl = `https://raw.githubusercontent.com/libretro-thumbnails/libretro-thumbnails/master/Sony_-_PlayStation/Named_Boxarts/${encodeURIComponent(title)}.png`;
            await db.games.add({ title, system: ext, romBlob: file, isFavorite: 0, cover: coverUrl });
        }
        renderGames();
    }

    async function renderGames() {
        const grid = document.getElementById('game-grid');
        grid.innerHTML = '';
        const games = await db.games.toArray();
        let filtered = currentFilter === 'all' ? games : (currentFilter === 'favorite' ? games.filter(g => g.isFavorite) : games.filter(g => g.system.includes(currentFilter)));

        filtered.forEach(game => {
            const card = document.createElement('div');
            card.className = `game-card glass fade-in relative group`;
            card.style.width = document.body.className.includes('switch') ? '280px' : '180px';
            card.innerHTML = `
                <img src="${game.cover}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/300?text=${encodeURIComponent(game.title)}'">
                <div class="absolute bottom-0 inset-x-0 p-4 bg-gradient-to-t from-black to-transparent opacity-0 group-hover:opacity-100 transition">
                    <div class="text-[10px] font-bold text-cyan-400 uppercase">${game.system}</div>
                    <div class="text-xs font-bold truncate">${game.title}</div>
                </div>
                <button onclick="toggleFav(event, ${game.id})" class="absolute top-2 right-2 text-xl">${game.isFavorite ? '⭐' : '☆'}</button>
                <button onclick="deleteGame(event, ${game.id})" class="absolute top-2 left-2 opacity-0 group-hover:opacity-100 text-red-500">🗑️</button>
            `;
            card.onclick = () => startEmulator(game.id);
            grid.appendChild(card);
        });
    }

    async function startEmulator(id) {
        const game = await db.games.get(id);
        document.getElementById('emulator-container').style.display = 'block';
        window.EJS_player = '#game';
        window.EJS_gameUrl = URL.createObjectURL(game.romBlob);
        window.EJS_core = game.system;
        window.EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/';
        window.EJS_startOnLoad = true;
        if (isMobile) window.EJS_browserMode = 'mobile';
        window.EJS_buttons = { l: true, r: true, l2: true, r2: true, l3: true, r3: true, leftStick: true, rightStick: true, select: true, start: true };
        
        if (game.system.includes('ps') || game.system === 'bin' || game.system === 'iso') {
            const bios = await db.config.get('ps_bios');
            if (bios) window.EJS_biosUrl = URL.createObjectURL(bios.blob);
            window.EJS_defaultControllerType = 5; 
            document.getElementById('emulator-container').classList.add('is-psx');
        }

        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/loader.js';
        document.body.appendChild(script);
    }

    // Вспомогательные функции
    async function toggleFav(e, id) { e.stopPropagation(); const g = await db.games.get(id); await db.games.update(id, {isFavorite: g.isFavorite ? 0 : 1}); renderGames(); }
    async function deleteGame(e, id) { e.stopPropagation(); if(confirm("Удалить?")) { await db.games.delete(id); renderGames(); } }
    function setFilter(sys, btn) { currentFilter = sys; document.getElementById('section-title').innerText = btn.title || "Библиотека"; renderGames(); }
    function stopEmulator() { location.reload(); }
    function toggleFullScreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
    async function exportLibrary() { const g = await db.games.toArray(); const blob = new Blob([JSON.stringify(g)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `retro_backup.json`; a.click(); }
    
    // Init
    const savedTheme = localStorage.getItem('retro-theme') || 'switch';
    changeTheme(savedTheme);
    setInterval(updateClock, 1000);
    initParticles(); animate(); renderGames();
    window.addEventListener('resize', initParticles);
</script>
</body>
</html>
