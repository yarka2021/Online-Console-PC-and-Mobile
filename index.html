<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RetroStation Pro Max</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700&display=swap');
        body { background: #020617; color: white; font-family: 'Inter', sans-serif; margin: 0; }
        .font-brand { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        
        #game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .game-card { transition: 0.3s; position: relative; border-radius: 15px; overflow: hidden; background: #1e293b; }
        .game-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px -10px #3b82f6; }
        
        .delete-btn { position: absolute; top: 5px; right: 5px; background: rgba(239, 68, 68, 0.8); width: 25px; height: 25px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 10; font-weight: bold; cursor: pointer; opacity: 0; transition: 0.2s; }
        .game-card:hover .delete-btn { opacity: 1; }

        #emulator-container { display: none; position: fixed; inset: 0; z-index: 9999; background: #000; }
        .emu-ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 10000; pointer-events: none; }
        .emu-ui button { pointer-events: auto; background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); font-size: 12px; font-weight: bold; }
        
        /* Заглушка обложки */
        .cover-art { height: 180px; background: linear-gradient(45deg, #0f172a, #1e293b); display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px; font-size: 12px; font-weight: bold; border-bottom: 3px solid #3b82f6; }
    </style>
</head>
<body>

<div id="ui-layer" class="p-5 max-w-6xl mx-auto">
    <header class="flex flex-col md:flex-row justify-between items-center gap-5 mb-10">
        <h1 class="text-4xl font-brand italic text-blue-500 tracking-tighter">RETRO<span class="text-white">STATION</span></h1>
        <div class="flex gap-2">
            <button onclick="document.getElementById('fileInput').click()" class="bg-blue-600 px-6 py-3 rounded-xl font-bold active:scale-95 transition">ДОБАВИТЬ ИГРЫ</button>
            <button onclick="document.getElementById('biosInput').click()" class="glass px-4 py-3 rounded-xl text-xs">BIOS PS1</button>
        </div>
    </header>

    <div id="game-grid"></div>
</div>

<div id="emulator-container">
    <div class="emu-ui">
        <button onclick="stopEmulator()" style="color: #ff4d4d;">ВЫЙТИ</button>
        <button onclick="alert('Чтобы изменить положение кнопок: Нажмите на Шестеренку -> Controls -> Move Buttons (Touch)')">ИНФО ПО КНОПКАМ</button>
    </div>
    <div id="game" style="width:100%; height:100%;"></div>
</div>

<input type="file" id="fileInput" class="hidden" multiple onchange="addGames(event)">
<input type="file" id="biosInput" class="hidden" onchange="addBios(event)">

<script>
    const db = new Dexie("GamePadStore");
    db.version(1).stores({ games: '++id, title, system, romBlob', config: 'name, blob' });

    const systemMap = {
        'nes': 'nes', 'sfc': 'snes', 'snes': 'snes', 'md': 'segaMD', 'bin': 'psx', 
        'chd': 'psx', 'iso': 'psx', 'cue': 'psx', 'gba': 'gba', 'n64': 'n64'
    };

    async function renderGames() {
        const grid = document.getElementById('game-grid');
        grid.innerHTML = '';
        const games = await db.games.toArray();
        games.forEach(game => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.innerHTML = `
                <div class="delete-btn" onclick="deleteGame(event, ${game.id})">×</div>
                <div onclick="startEmulator(${game.id})">
                    <div class="cover-art">${game.title}</div>
                    <div class="p-3">
                        <div class="text-[10px] text-blue-400 font-bold uppercase">${game.system}</div>
                        <div class="truncate text-sm font-bold">${game.title}</div>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    async function addGames(event) {
        for (const file of event.target.files) {
            const ext = file.name.split('.').pop().toLowerCase();
            await db.games.add({ title: file.name.replace(/\.[^/.]+$/, ""), system: systemMap[ext] || 'nes', romBlob: file });
        }
        renderGames();
    }

    async function deleteGame(e, id) {
        e.stopPropagation();
        if(confirm("Удалить игру?")) { await db.games.delete(id); renderGames(); }
    }

    async function addBios(event) {
        if (event.target.files[0]) {
            await db.config.put({ name: 'ps1_bios', blob: event.target.files[0] });
            alert("BIOS сохранен!");
        }
    }

    async function startEmulator(gameId) {
        const game = await db.games.get(gameId);
        document.getElementById('emulator-container').style.display = 'block';
        
        window.EJS_player = '#game';
        window.EJS_gameUrl = URL.createObjectURL(game.romBlob);
        window.EJS_core = game.system;
        window.EJS_pathtodata = 'https://rawcdn.githack.com/EmulatorJS/EmulatorJS/main/data/';
        window.EJS_startOnLoad = true;

        // Настройки управления для PS1 и других
        window.EJS_buttons = {
            l1: true, r1: true, l2: true, r2: true, // Включаем все шифты
            l3: true, r3: true,                     // Стики-кнопки
            leftStick: true, rightStick: true,     // Два стика
            select: true, start: true
        };

        if (game.system === 'psx') {
            const bios = await db.config.get('ps1_bios');
            if (bios) window.EJS_biosUrl = URL.createObjectURL(bios.blob);
            window.EJS_defaultControllerType = 5; // Активируем DualShock (Стики)
        }

        const script = document.createElement('script');
        script.src = 'https://rawcdn.githack.com/EmulatorJS/EmulatorJS/main/data/loader.js';
        document.body.appendChild(script);
    }

    function stopEmulator() { location.reload(); }
    renderGames();
</script>

</body>
</html>
