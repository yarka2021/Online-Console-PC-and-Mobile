<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RetroStation</title>
    
    <!-- PWA Настройки -->
    <meta name="theme-color" content="#00439c">
    <link rel="manifest" href="data:application/manifest+json;base64,ewogICJuYW1lIjogIlJldHJvU3RhdGlvbiBFdGVybmFsIiwKICAic2hvcnRfbmFtZSI6ICJSZXRyb1N0YXRpb24iLAogICJzdGFydF91cmwiOiAiLiIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiIzAwMDIwNSIsCiAgInRoZW1lX2NvbG9yIjogIiMwMDQzOWMiLAogICJpY29ucyI6IFt7InNyYyI6ICJodHRwczovL3ZpYS5wbGFjZWhvbGRlci5jb20vMTkyLzAwNDM5Yy9mZmZmZmYiLCAic2l6ZXMiOiAiMTkyeDE5MiIsICJ0eXBlIjogImltYWdlL3BuZyJ9XQp9">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap');
        
        :root { --ps-blue: #00439c; --theme-color: #00439c; --bg-dark: #000205; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; user-select: none; }

        #bg-canvas { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 70% 20%, var(--theme-color), transparent 50%), radial-gradient(circle at 20% 80%, #000, transparent 50%); transition: background 1.5s ease; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.08); }
        
        .game-card { position: relative; transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); border-radius: 14px; transform-origin: center; cursor: pointer; border: 1px solid transparent; }
        .game-card:hover { transform: scale(1.12) translateY(-10px); z-index: 50; box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 20px var(--theme-color); border: 2px solid white; }
        .game-card.favorite::after { content: '★'; position: absolute; top: 8px; right: 8px; color: #ffd700; font-size: 18px; text-shadow: 0 0 5px black; z-index: 10; }

        .filter-btn { position: relative; padding: 12px 18px; font-weight: 600; font-size: 12px; color: rgba(255,255,255,0.4); transition: 0.4s; white-space: nowrap; text-transform: uppercase; letter-spacing: 1px; }
        .filter-btn.active { color: white; transform: scale(1.15); }
        .filter-btn.active::after { content: ''; position: absolute; bottom: 0; left: 50%; width: 20px; height: 2px; background: white; transform: translateX(-50%); box-shadow: 0 0 10px white; }

        #emulator-container { display: none; position: fixed; inset: 0; z-index: 9999; background: #000; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* PlayStation Symbols Overrides */
        .is-psx [data-button], .is-ps2 [data-button] { color: transparent !important; }
        .is-psx [data-button]::after, .is-ps2 [data-button]::after { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: white !important; font-size: 24px; visibility: visible; font-weight: 900; }
        .is-psx [data-button="a"]::after, .is-ps2 [data-button="a"]::after { content: "✖"; color: #88aaff !important; }
        .is-psx [data-button="b"]::after, .is-ps2 [data-button="b"]::after { content: "●"; color: #ff8888 !important; }
        .is-psx [data-button="x"]::after, .is-ps2 [data-button="x"]::after { content: "■"; color: #ffcc88 !important; }
        .is-psx [data-button="y"]::after, .is-ps2 [data-button="y"]::after { content: "▲"; color: #88ff88 !important; }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div id="ui-layer" class="p-4 md:p-12 min-h-screen flex flex-col relative z-10">
    <!-- Top Bar -->
    <header class="flex justify-between items-center mb-10">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-2xl bg-white/5 flex items-center justify-center font-black text-2xl glass border-white/20">RS</div>
            <div>
                <h1 class="text-xl font-light tracking-[0.2em] uppercase">Eternal <span class="font-black text-blue-500">Hub</span></h1>
                <p id="game-count" class="text-[9px] opacity-40 font-bold tracking-widest uppercase"></p>
            </div>
        </div>
        <div class="flex gap-3">
            <button onclick="exportLibrary()" class="glass w-10 h-10 rounded-full flex items-center justify-center hover:bg-white/10 transition">☁️</button>
            <button onclick="document.getElementById('fileInput').click()" class="glass px-6 py-2 rounded-full font-bold text-xs hover:bg-white/20 transition uppercase tracking-tighter">Добавить контент</button>
        </div>
    </header>

    <!-- Search (Visible if games >= 15) -->
    <div id="search-container" class="hidden mb-8 animate-fade-in">
        <input type="text" id="searchInput" oninput="searchGames()" placeholder="Поиск в библиотеке..." class="w-full max-w-lg glass bg-white/5 border-none rounded-2xl px-8 py-4 text-white outline-none focus:ring-2 ring-blue-500/50 transition-all">
    </div>

    <!-- Navigation -->
    <nav class="flex gap-2 overflow-x-auto no-scrollbar mb-10 pb-4 mask-fade">
        <button onclick="setFilter('all', this, '#00439c')" class="filter-btn active">Все</button>
        <button onclick="setFilter('favorite', this, '#ffd700')" class="filter-btn">⭐ Избранное</button>
        <button onclick="setFilter('psx', this, '#00439c')" class="filter-btn">PlayStation</button>
        <button onclick="setFilter('nes', this, '#ffffff')" class="filter-btn">NES</button>
        <button onclick="setFilter('snes', this, '#ff4d4d')" class="filter-btn">SNES</button>
        <button onclick="setFilter('gba', this, '#10b981')" class="filter-btn">GBA</button>
        <button onclick="setFilter('segaMD', this, '#3b82f6')" class="filter-btn">Sega</button>
        <button onclick="setFilter('dos', this, '#fb923c')" class="filter-btn">MS-DOS</button>
        <button onclick="setFilter('mame', this, '#facc15')" class="filter-btn">MAME</button>
        <button onclick="setFilter('nds', this, '#f43f5e')" class="filter-btn">NDS</button>
    </nav>

    <!-- Library Grid -->
    <div id="game-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 gap-6"></div>
</div>

<!-- Emulator Overlay -->
<div id="emulator-container">
    <div class="absolute top-6 left-6 z-[10000] flex gap-3">
        <button onclick="stopEmulator()" class="glass px-6 py-2 rounded-xl font-bold text-red-500 text-xs uppercase tracking-widest hover:bg-red-500/20 transition">Выход</button>
        <button onclick="shareNetplay()" id="netplay-share-btn" class="glass px-6 py-2 rounded-xl font-bold text-blue-400 text-xs uppercase tracking-widest hidden">Пригласить друга 🌐</button>
    </div>
    <div id="game" style="width:100%; height:100%;"></div>
</div>

<input type="file" id="fileInput" class="hidden" multiple onchange="addGames(event)">
<input type="file" id="biosInput" class="hidden" onchange="addBios(event)">

<script>
    const db = new Dexie("RetroEternalStore");
    db.version(1).stores({ 
        games: '++id, title, system, romBlob, isFavorite, cover', 
        config: 'name, blob' 
    });

    let currentFilter = 'all';
    let netplayRoom = new URLSearchParams(window.location.search).get('room');

    // --- PS5 Background Canvas ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let mouse = { x: 0, y: 0 };

    function initParticles() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        particles = [];
        for(let i=0; i<70; i++) particles.push({ 
            x: Math.random() * canvas.width, 
            y: Math.random() * canvas.height, 
            size: Math.random() * 2 + 0.5, 
            speedX: (Math.random() - 0.5) * 0.4, 
            speedY: (Math.random() - 0.5) * 0.4, 
            alpha: Math.random() * 0.5 + 0.2 
        });
    }

    function animateBackground() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            p.x += p.speedX; p.y += p.speedY;
            if(p.x > canvas.width) p.x = 0; if(p.y > canvas.height) p.y = 0;
            ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        });
        requestAnimationFrame(animateBackground);
    }

    window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('resize', initParticles);

    function setFilter(sys, btn, color) {
        currentFilter = sys;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.documentElement.style.setProperty('--theme-color', color);
        renderGames();
    }

    // --- Logic ---
    const systemMap = {
        'nes': 'nes', 'snes': 'snes', 'sfc': 'snes', 'smc': 'snes', 'md': 'segaMD', 
        'bin': 'psx', 'chd': 'psx', 'iso': 'psx', 'gba': 'gba', 'gb': 'gb', 'gbc': 'gbc', 
        'n64': 'n64', 'nds': 'nds', 'sms': 'segaMS', 'gg': 'segaGG', 'pce': 'pce', 
        'ws': 'wswan', 'wsc': 'wswan', 'zip': 'mame'
    };

    async function addGames(event) {
        for (const file of event.target.files) {
            if (file.type === "application/json") {
                const reader = new FileReader();
                reader.onload = async (e) => { try { const games = JSON.parse(e.target.result); await db.games.bulkAdd(games); renderGames(); } catch(err) { alert("Ошибка импорта"); } };
                reader.readAsText(file); continue;
            }
            const ext = file.name.split('.').pop().toLowerCase();
            let system = systemMap[ext] || 'nes';
            if (ext === 'zip') {
                const choice = prompt("Тип ZIP-архива:\n1 - MAME (Аркады)\n2 - DOS\n3 - Neo Geo\n4 - ScummVM", "1");
                system = choice === "2" ? "dos" : (choice === "3" ? "neogeo" : (choice === "4" ? "scummvm" : "mame"));
            } else if (ext === 'iso' && file.size > 500000000) {
                system = confirm("Это игра PS2?") ? 'play' : 'psx';
            }
            const title = file.name.replace(/\.[^/.]+$/, "");
            const coverUrl = `https://raw.githubusercontent.com/libretro-thumbnails/libretro-thumbnails/master/${getLibName(system)}/Named_Boxarts/${encodeURIComponent(title)}.png`;
            await db.games.add({ title, system, romBlob: file, isFavorite: 0, cover: coverUrl });
        }
        renderGames();
    }

    function getLibName(sys) {
        const m = {'psx':'Sony_-_PlayStation','nes':'Nintendo_-_Nintendo_Entertainment_System','snes':'Nintendo_-_Super_Nintendo_Entertainment_System','gba':'Nintendo_-_Game_Boy_Advance','mame':'MAME','dos':'DOS'};
        return m[sys] || 'Sony_-_PlayStation';
    }

    async function renderGames() {
        const grid = document.getElementById('game-grid');
        grid.innerHTML = '';
        const games = await db.games.toArray();
        document.getElementById('game-count').innerText = `${games.length} объектов в системе`;
        document.getElementById('search-container').classList.toggle('hidden', games.length < 15);
        
        let filtered = games;
        if(currentFilter === 'favorite') filtered = games.filter(g => g.isFavorite);
        else if(currentFilter !== 'all') filtered = games.filter(g => g.system === (currentFilter === 'ps2' ? 'play' : currentFilter));

        filtered.forEach(game => {
            const card = document.createElement('div');
            card.className = `game-card glass overflow-hidden ${game.isFavorite ? 'favorite' : ''}`;
            card.innerHTML = `
                <div class="aspect-[3/4] bg-neutral-900 relative group">
                    <img src="${game.cover}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/300x400/050505/fff?text=${encodeURIComponent(game.title)}'">
                    <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-4">
                        <button onclick="toggleFav(event, ${game.id})" class="text-2xl hover:scale-125 transition">⭐</button>
                        <button onclick="startNetplay(event, ${game.id})" class="text-2xl hover:scale-125 transition">🌐</button>
                        <button onclick="deleteGame(event, ${game.id})" class="text-2xl hover:scale-125 transition">🗑️</button>
                    </div>
                    <div class="absolute bottom-0 inset-x-0 p-4 bg-gradient-to-t from-black via-black/80 to-transparent">
                        <div class="text-[8px] font-black text-blue-500 uppercase tracking-[0.2em] mb-1">${game.system}</div>
                        <div class="text-[11px] font-bold truncate tracking-wide">${game.title}</div>
                    </div>
                </div>
            `;
            card.onclick = () => startEmulator(game.id);
            grid.appendChild(card);
        });
    }

    async function toggleFav(e, id) { e.stopPropagation(); const g = await db.games.get(id); await db.games.update(id, {isFavorite: g.isFavorite ? 0 : 1}); renderGames(); }
    async function deleteGame(e, id) { e.stopPropagation(); if(confirm("Удалить навсегда?")) { await db.games.delete(id); renderGames(); } }
    
    async function startNetplay(e, id) { 
        e.stopPropagation(); 
        const room = Math.random().toString(36).substring(7);
        const url = new URL(window.location);
        url.searchParams.set('room', room);
        url.searchParams.set('gameId', id);
        window.history.pushState({}, '', url);
        startEmulator(id);
    }

    function shareNetplay() { navigator.clipboard.writeText(window.location.href); alert("Ссылка на онлайн-комнату скопирована!"); }

    async function startEmulator(id) {
        const game = await db.games.get(parseInt(id));
        document.getElementById('emulator-container').style.display = 'block';
        const romUrl = URL.createObjectURL(game.romBlob);

        window.EJS_player = '#game';
        window.EJS_gameUrl = romUrl;
        window.EJS_core = game.system;
        window.EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/';
        window.EJS_startOnLoad = true;
        window.EJS_settings = { rewind: true, cheats: true };

        if (netplayRoom) {
            window.EJS_netplayServer = 'wss://netplay.emulatorjs.org:443';
            window.EJS_netplayRoom = netplayRoom;
            document.getElementById('netplay-share-btn').classList.remove('hidden');
        }

        if (/Android|iPhone|iPad/i.test(navigator.userAgent)) window.EJS_browserMode = 'mobile';
        if (game.system === 'psx' || game.system === 'play') {
            const bios = await db.config.get('ps_bios');
            if (bios) window.EJS_biosUrl = URL.createObjectURL(bios.blob);
            window.EJS_defaultControllerType = 5; 
            document.getElementById('emulator-container').classList.add('is-psx');
        }

        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/loader.js';
        document.body.appendChild(script);
    }

    function stopEmulator() { window.location.href = window.location.pathname; }
    function searchGames() { const q = document.getElementById('searchInput').value.toLowerCase(); document.querySelectorAll('.game-card').forEach(c => c.style.display = c.innerText.toLowerCase().includes(q) ? 'block' : 'none'); }
    async function exportLibrary() { const g = await db.games.toArray(); const blob = new Blob([JSON.stringify(g)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `backup_${Date.now()}.json`; a.click(); }

    initParticles(); animateBackground(); renderGames();
    if (netplayRoom) { const gId = new URLSearchParams(window.location.search).get('gameId'); if(gId) setTimeout(() => startEmulator(gId), 1500); }
</script>
</body>
</html>
