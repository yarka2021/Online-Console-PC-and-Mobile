<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N64 Ultra Station</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-purple: #bc13fe;
            --bg-dark: #050507;
        }

        body {
            margin: 0;
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Анимированный фон */
        .grid-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(188, 19, 254, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(188, 19, 254, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            perspective: 500px;
            transform: rotateX(60deg);
            z-index: -1;
            animation: move 2s linear infinite;
        }

        @keyframes move {
            from { background-position: 0 0; }
            to { background-position: 0 40px; }
        }

        .container {
            width: 800px;
            max-width: 95vw;
            text-align: center;
            z-index: 1;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.2rem;
            color: var(--neon-blue);
            text-shadow: 0 0 15px var(--neon-blue);
            margin-bottom: 20px;
        }

        #game-wrapper {
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #000;
            border: 3px solid var(--neon-purple);
            box-shadow: 0 0 30px rgba(188, 19, 254, 0.4);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        /* Стиль загрузки */
        #loader-info {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid var(--neon-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .btn-select {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background: transparent;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            text-transform: uppercase;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            border-radius: 5px;
        }

        .btn-select:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 20px var(--neon-blue);
        }

        input[type="file"] { display: none; }

        .footer-info {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="grid-bg"></div>

    <div class="container">
        <h1>N64 RETRO ENGINE</h1>

        <div id="game-wrapper">
            <div id="loader-info">
                <div class="spinner"></div>
                <p>Загрузка ядра N64... подождите</p>
            </div>
            
            <div id="emulator" style="width: 100%; height: 100%;">
                <div style="padding-top: 20%; color: #444;">Выберите файл .z64 или .n64 для начала</div>
            </div>
        </div>

        <label class="btn-select">
            Открыть ROM файл
            <input type="file" id="file-input" accept=".n64,.z64,.v64">
        </label>

        <div class="footer-info">
            Управление: Стрелки - Стик | X, C - A, B | Z - Z-Trigger | Enter - Start
        </div>
    </div>

    <!-- Загружаем основной скрипт эмулятора -->
    <script>
        const fileInput = document.getElementById('file-input');
        const loader = document.getElementById('loader-info');
        const emuDiv = document.getElementById('emulator');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // Показываем лоадер
            loader.style.display = 'flex';
            emuDiv.innerHTML = ''; // Очищаем контейнер

            // Настройки EmulatorJS
            window.EJS_player = '#emulator';
            window.EJS_core = 'n64'; 
            window.EJS_gameName = file.name;
            window.EJS_startOnLoaded = true;
            
            // Используем официальный CDN данных EmulatorJS
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/latest/data/';
            
            const reader = new FileReader();
            reader.onload = function(event) {
                window.EJS_gameUrl = URL.createObjectURL(new Blob([event.target.result]));

                // Динамическая загрузка лоадера
                const script = document.createElement('script');
                script.src = 'https://cdn.emulatorjs.org/latest/data/loader.js';
                script.onload = () => {
                    console.log("Эмулятор загружен");
                    loader.style.display = 'none';
                };
                document.body.appendChild(script);
            };
            reader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
