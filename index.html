<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RetroStation Ultimate X</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700;800&display=swap');
        
        body { background: #020617; color: white; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .font-brand { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        
        #game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        @media (min-width: 768px) { #game-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); } }

        .game-card { transition: 0.3s; position: relative; border-radius: 15px; overflow: hidden; background: #1e293b; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .game-card:hover { transform: translateY(-5px); border-color: #3b82f6; }
        
        .delete-btn { 
            position: absolute; top: 8px; right: 8px; 
            background: rgba(239, 68, 68, 0.9); width: 28px; height: 28px; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            z-index: 20; font-weight: bold; font-size: 18px;
        }

        .active-filter { background: #3b82f6 !important; color: white; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }

        #emulator-container { display: none; position: fixed; inset: 0; z-index: 9999; background: #000; }

        /* --- SONY PLAYSTATION UI FIX --- */
        .is-psx [data-button], .is-ps2 [data-button] { color: transparent !important; position: relative; }
        .is-psx [data-button]::after, .is-ps2 [data-button]::after {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; 
            color: white !important; font-size: 22px; visibility: visible; font-weight: bold;
        }
        .is-psx [data-button="a"]::after, .is-ps2 [data-button="a"]::after { content: "✖"; color: #88aaff !important; }
        .is-psx [data-button="b"]::after, .is-ps2 [data-button="b"]::after { content: "●"; color: #ff8888 !important; }
        .is-psx [data-button="x"]::after, .is-ps2 [data-button="x"]::after { content: "■"; color: #ffcc88 !important; }
        .is-psx [data-button="y"]::after, .is-ps2 [data-button="y"]::after { content: "▲"; color: #88ff88 !important; }
        
        .is-psx [data-button="l"]::after, .is-ps2 [data-button="l"]::after { content: "L1"; font-size: 14px; }
        .is-psx [data-button="r"]::after, .is-ps2 [data-button="r"]::after { content: "R1"; font-size: 14px; }
        .is-psx [data-button="l2"]::after, .is-ps2 [data-button="l2"]::after { content: "L2"; font-size: 14px; }
        .is-psx [data-button="r2"]::after, .is-ps2 [data-button="r2"]::after { content: "R2"; font-size: 14px; }

        .is-psx [data-button="l2"], .is-psx [data-button="r2"],
        .is-ps2 [data-button="l2"], .is-ps2 [data-button="r2"] { display: flex !important; visibility: visible !important; opacity: 1 !important; }

        .emu-ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 10000; pointer-events: none; }
        .emu-ui button { pointer-events: auto; background: rgba(0,0,0,0.6); color: white; padding: 8px 15px; border-radius: 10px; font-size: 11px; font-weight: bold; }

        .cover-art { aspect-ratio: 3/4; background: linear-gradient(45deg, #0f172a, #1e293b); display: flex; align-items: center; justify-content: center; text-align: center; padding: 15px; font-size: 12px; font-weight: 800; border-bottom: 3px solid #3b82f6; text-transform: uppercase; color: #94a3b8; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .filter-section-title { font-size: 10px; font-weight: 900; color: #475569; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; margin-top: 15px; }
    </style>
</head>
<body>

<div id="ui-layer" class="p-5 max-w-7xl mx-auto">
    <header class="flex flex-col md:flex-row justify-between items-center gap-6 mb-10 text-center md:text-left">
        <div>
            <h1 class="text-4xl font-brand italic text-blue-500 tracking-tighter uppercase leading-none">Retro Station</h1>
        </div>
        <div class="flex flex-wrap gap-2 justify-center">
            <button onclick="toggleFullScreen()" class="glass px-4 py-3 rounded-xl text-xs font-bold uppercase tracking-widest text-white">Экран</button>
            <button onclick="document.getElementById('fileInput').click()" class="bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-xl font-black text-sm shadow-lg active:scale-95 transition">+ ДОБАВИТЬ</button>
            <button onclick="document.getElementById('biosInput').click()" class="glass px-4 py-3 rounded-xl text-xs uppercase italic">BIOS PS1</button>
        </div>
    </header>

    <!-- Фильтры -->
    <div class="flex flex-col gap-1 mb-8 overflow-x-auto no-scrollbar">
        <div class="flex gap-2 pb-2">
            <button onclick="filterSystem('all', this)" class="filter-btn active-filter glass px-6 py-2 rounded-full text-[10px] font-bold uppercase text-white">Все</button>
        </div>

        <div class="filter-section-title">Sony & Nintendo</div>
        <div class="flex gap-2 pb-2 items-start">
            <button onclick="filterSystem('psx', this)" class="filter-btn glass px-5 py-2 rounded-full text-[10px] font-bold text-indigo-400 uppercase">PS1</button>
            <div class="flex flex-col items-center gap-1">
                <button onclick="filterSystem('ps2', this)" class="filter-btn glass px-5 py-2 rounded-full text-[10px] font-bold text-blue-400 uppercase">PS2 (Exp)</button>
                <span class="text-[6px] text-red-500 font-bold uppercase">Heavy PC</span>
            </div>
            <div class="flex flex-col items-center gap-1">
                <button onclick="filterSystem('3ds', this)" class="filter-btn glass px-5 py-2 rounded-full text-[10px] font-bold text-red-300 uppercase">3DS / 2DS</button>
                <span class="text-[6px] text-red-500 font-bold uppercase">Exp / Slow</span>
            </div>
            <button onclick="filterSystem('nds', this)" class="filter-btn glass px-5 py-2 rounded-full text-[10px] font-bold text-red-500 uppercase">NDS</button>
            <button onclick="filterSystem('gba', this)" class="filter-btn glass px-5 py-2 rounded-full text-[10px] font-bold text-green-400 uppercase">GBA</button>
            <button onclick="filterSystem('snes', this)" class="filter-btn glass px-5 py-2 rounded-full text-[10px] font-bold text-red-500 uppercase">SNES</button>
            <button onclick="filterSystem('nes', this)" class="filter-btn glass px-5 py-2 rounded-full text-[10px] font-bold text-white uppercase">NES</button>
            <button onclick="filterSystem('gbc', this)" class="filter-btn glass px-5 py-2 rounded-full text-[10px] font-bold text-yellow-400 uppercase">GBC</button>
            <button onclick="filterSystem('gb', this)" class="filter-btn glass px-5 py-2 rounded-full text-[10px] font-bold text-emerald-400 uppercase">GB</button>
        </div>

        <div class="filter-section-title">Sega & Others</div>
        <div class="flex gap-2">
            <button onclick="filterSystem('segaMD', this)" class="filter-btn glass px-5 py-2 rounded-full text-[10px] font-bold text-blue-300 uppercase">Mega Drive</button>
            <button onclick="filterSystem('pce', this)" class="filter-btn glass px-5 py-2 rounded-full text-[10px] font-bold text-orange-400 uppercase">PC Engine</button>
            <button onclick="filterSystem('n64', this)" class="filter-btn glass px-5 py-2 rounded-full text-[10px] font-bold text-red-400 uppercase">N64</button>
            <button onclick="filterSystem('dos', this)" class="filter-btn glass px-5 py-2 rounded-full text-[10px] font-bold text-orange-200 uppercase">DOS</button>
            <button onclick="filterSystem('mame', this)" class="filter-btn glass px-5 py-2 rounded-full text-[10px] font-bold text-yellow-500 uppercase">MAME</button>
            <button class="glass px-5 py-2 rounded-full text-[10px] font-bold text-green-600 uppercase opacity-40 cursor-not-allowed">Xbox (Soon)</button>
        </div>
    </div>

    <div id="game-grid"></div>
</div>

<div id="emulator-container">
    <div class="emu-ui">
        <button onclick="stopEmulator()" style="color: #ff4d4d;">ВЫЙТИ</button>
        <button onclick="alert('Управление настроено автоматически.\n3DS и PS2 являются экспериментальными ядрами.')">ИНФО</button>
    </div>
    <div id="game" style="width:100%; height:100%;"></div>
</div>

<input type="file" id="fileInput" class="hidden" multiple accept=".nes,.snes,.sfc,.smc,.gba,.gb,.gbc,.md,.gen,.bin,.cue,.chd,.iso,.n64,.zip,.exe,.nds,.sms,.gg,.pce,.a26,.ngc,.3ds,.cia" onchange="addGames(event)">
<input type="file" id="biosInput" class="hidden" onchange="addBios(event)">

<script>
    const db = new Dexie("RetroFinalUltimateStore");
    db.version(1).stores({ games: '++id, title, system, romBlob', config: 'name, blob' });

    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 0);

    const systemMap = {
        'nes': 'nes', 'snes': 'snes', 'sfc': 'snes', 'smc': 'snes',
        'md': 'segaMD', 'gen': 'segaMD', 'bin': 'psx', 'chd': 'psx', 
        'cue': 'psx', 'gba': 'gba', 'gb': 'gb', 'gbc': 'gbc',
        'n64': 'n64', 'zip': 'mame', 'exe': 'dos',
        'nds': 'nds', 'sms': 'segaMS', 'gg': 'segaGG', 'pce': 'pce',
        'a26': 'atari2600', 'ngc': 'ngp', '3ds': '3ds', 'cia': '3ds'
    };

    async function renderGames(filter = 'all') {
        const grid = document.getElementById('game-grid');
        grid.innerHTML = '';
        const games = await db.games.toArray();
        const filtered = filter === 'all' ? games : games.filter(g => g.system === (filter === 'ps2' ? 'play' : filter));

        filtered.forEach(game => {
            const card = document.createElement('div');
            card.className = 'game-card shadow-lg border border-white/5';
            card.innerHTML = `
                <div class="delete-btn" onclick="deleteGame(event, ${game.id})">×</div>
                <div onclick="startEmulator(${game.id})">
                    <div class="cover-art font-bold text-center">${game.title}</div>
                    <div class="p-3 text-center uppercase">
                        <div class="text-[9px] text-blue-400 font-black">${game.system === 'play' ? 'ps2' : (game.system === '3ds' ? '3ds / 2ds' : game.system)}</div>
                        <div class="truncate text-xs font-bold text-slate-300 italic">${game.title}</div>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    async function addGames(event) {
        for (const file of event.target.files) {
            const ext = file.name.split('.').pop().toLowerCase();
            let system = systemMap[ext] || 'nes';
            if (ext === 'iso') system = confirm("PlayStation 2?") ? 'play' : 'psx';
            await db.games.add({ title: file.name.replace(/\.[^/.]+$/, ""), system, romBlob: file });
        }
        renderGames();
    }

    async function startEmulator(gameId) {
        const game = await db.games.get(gameId);
        const container = document.getElementById('emulator-container');
        
        container.classList.remove('is-psx', 'is-ps2');
        if (game.system === 'psx') container.classList.add('is-psx');
        if (game.system === 'play') container.classList.add('is-ps2');
        container.style.display = 'block';

        window.EJS_player = '#game';
        window.EJS_gameUrl = URL.createObjectURL(game.romBlob);
        window.EJS_core = game.system;
        window.EJS_pathtodata = 'https://rawcdn.githack.com/EmulatorJS/EmulatorJS/main/data/';
        window.EJS_startOnLoad = true;
        if (isMobile) window.EJS_browserMode = 'mobile';
        
        window.EJS_buttons = { l: true, r: true, l2: true, r2: true, l3: true, r3: true, leftStick: true, rightStick: true, select: true, start: true };

        if (game.system === 'psx' || game.system === 'play') {
            const bios = await db.config.get('ps_bios');
            if (bios) window.EJS_biosUrl = URL.createObjectURL(bios.blob);
            window.EJS_defaultControllerType = 5; 
        }

        const script = document.createElement('script');
        script.src = 'https://rawcdn.githack.com/EmulatorJS/EmulatorJS/main/data/loader.js';
        document.body.appendChild(script);
    }

    async function deleteGame(e, id) { e.stopPropagation(); if(confirm("Удалить?")) { await db.games.delete(id); renderGames(); } }
    async function addBios(event) { if (event.target.files[0]) { await db.config.put({ name: 'ps_bios', blob: event.target.files[0] }); location.reload(); } }
    function stopEmulator() { location.reload(); }
    function toggleFullScreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
    function filterSystem(sys, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active-filter'));
        btn.classList.add('active-filter');
        renderGames(sys);
    }
    renderGames();
</script>

</body>
</html>
