<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RetroCloud Ultimate</title>
    
    <!-- КРИТИЧЕСКИЙ СКРИПТ: Позволяет запускать эмуляторы на GitHub Pages -->
    <script src="https://cdn.jsdelivr.net/gh/gzuidhof/coi-serviceworker@latest/coi-serviceworker.min.js"></script>
    
    <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
    <script src="https://unpkg.com/nostalgist/dist/nostalgist.umd.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root { --bg: #0a0a0a; --panel: #1a1a1a; --accent: #00e5ff; --text: #ffffff; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        header { background: #000; padding: 15px; display: flex; align-items: center; border-bottom: 2px solid var(--accent); justify-content: space-between; }
        .logo { font-family: 'Orbitron', sans-serif; color: var(--accent); font-size: 1.2rem; cursor: pointer; text-shadow: 0 0 10px var(--accent); }
        
        .screen { display: none; height: calc(100% - 65px); overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .active { display: block; }

        /* СЕТКА КОНСОЛЕЙ */
        .console-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; max-width: 800px; margin: 0 auto; }
        .console-card { background: var(--panel); border-radius: 12px; padding: 25px 10px; text-align: center; border: 1px solid #333; cursor: pointer; transition: 0.2s; }
        .console-card:hover { border-color: var(--accent); transform: scale(1.05); }
        .console-card span { display: block; margin-top: 10px; font-weight: bold; font-size: 0.9rem; letter-spacing: 1px; }

        /* СПИСОК ИГР */
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 15px; }
        .game-card { background: var(--panel); border-radius: 10px; overflow: hidden; border: 1px solid #222; position: relative; cursor: pointer; }
        .game-card img { width: 100%; aspect-ratio: 1; object-fit: cover; }
        .game-card .name { padding: 5px; font-size: 0.75rem; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* ЭМУЛЯТОР */
        #emu-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: none; }
        .exit-btn { position: absolute; top: 15px; right: 15px; z-index: 10000; background: #ff3d00; color: #fff; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; }

        /* ТАЧ КНОПКИ */
        .touch-zone { position: absolute; bottom: 30px; left: 0; width: 100%; display: none; justify-content: space-between; padding: 0 25px; box-sizing: border-box; pointer-events: none; z-index: 10001; }
        .t-btn { width: 65px; height: 65px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; pointer-events: auto; backdrop-filter: blur(4px); -webkit-user-select: none; }
        .t-btn:active { background: var(--accent); color: #000; }
        
        .dpad { display: grid; grid-template-columns: repeat(3, 55px); }
        .actions { display: flex; gap: 15px; align-items: flex-end; }

        .add-btn { position: fixed; bottom: 30px; right: 30px; background: var(--accent); width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-size: 30px; cursor: pointer; box-shadow: 0 0 20px rgba(0,229,255,0.4); z-index: 100; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="location.reload()">RETRO CLOUD</div>
        <div id="status" style="font-size: 10px; color: #666;">ЗАГРУЗКА...</div>
    </header>

    <!-- Выбор консоли -->
    <div id="main-screen" class="screen active">
        <div class="console-grid">
            <div class="console-card" onclick="openLib('nes')">🎮<span>NES</span></div>
            <div class="console-card" onclick="openLib('snes')">🕹️<span>SNES</span></div>
            <div class="console-card" onclick="openLib('gba')">📟<span>GBA</span></div>
            <div class="console-card" onclick="openLib('gbc')">🌈<span>GBC</span></div>
            <div class="console-card" onclick="openLib('sega')">🦔<span>SEGA</span></div>
            <div class="console-card" onclick="openLib('ps1')">💿<span>PS1</span></div>
            <div class="console-card" onclick="openLib('n64')">🧊<span>N64</span></div>
        </div>
    </div>

    <!-- Библиотека игр -->
    <div id="lib-screen" class="screen">
        <div id="game-grid" class="game-grid"></div>
        <div class="add-btn" onclick="document.getElementById('f-input').click()">+</div>
    </div>

    <!-- Экран игры -->
    <div id="emu-screen">
        <button class="exit-btn" onclick="quitGame()">ВЫХОД</button>
        <div id="emu-canvas" style="width:100%; height:100%;"></div>
        
        <div id="touch-ui" class="touch-zone">
            <div class="dpad">
                <div></div><div class="t-btn" id="up">↑</div><div></div>
                <div class="t-btn" id="left">←</div><div></div><div class="t-btn" id="right">→</div>
                <div></div><div class="t-btn" id="down">↓</div><div></div>
            </div>
            <div class="actions">
                <div class="t-btn" id="start" style="width:45px; height:45px; font-size:10px">START</div>
                <div class="t-btn" id="b">B</div>
                <div class="t-btn" id="a">A</div>
            </div>
        </div>
    </div>

    <input type="file" id="f-input" hidden onchange="importGame(event)">

<script>
    // Настройка Базы Данных
    const db = new Dexie("RetroStore");
    db.version(1).stores({ games: '++id, type, name, data, cover' });

    let currentType = '';
    let emuInstance = null;

    // Инициализация
    window.onload = () => {
        document.getElementById('status').innerText = 'СИСТЕМА ГОТОВА';
    };

    function openLib(type) {
        currentType = type;
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('lib-screen').classList.add('active');
        document.getElementById('status').innerText = 'КОНСОЛЬ: ' + type.toUpperCase();
        drawLibrary();
    }

    async function drawLibrary() {
        const grid = document.getElementById('game-grid');
        grid.innerHTML = '';
        const games = await db.games.where('type').equals(currentType).toArray();
        games.forEach(g => {
            const el = document.createElement('div');
            el.className = 'game-card';
            el.onclick = () => launch(g);
            el.innerHTML = `<img src="${g.cover}" onerror="this.src='https://via.placeholder.com/150?text=GAME'"><div class="name">${g.name}</div>`;
            grid.appendChild(el);
        });
    }

    async function importGame(e) {
        const file = e.target.files[0];
        if(!file) return;
        const name = file.name.replace(/\.[^/.]+$/, "");
        const buffer = await file.arrayBuffer();
        
        // Попытка найти обложку
        const platformPaths = { nes:'Nintendo_-_Nintendo_Entertainment_System', snes:'Nintendo_-_Super_Nintendo_Entertainment_System', gba:'Nintendo_-_Game_Boy_Advance', gbc:'Nintendo_-_Game_Boy_Color', sega:'Sega_-_Mega_Drive_-_Genesis', ps1:'Sony_-_PlayStation', n64:'Nintendo_-_Nintendo_64' };
        const cover = `https://raw.githubusercontent.com/libretro/libretro-thumbnails/master/${platformPaths[currentType]}/Named_Boxarts/${encodeURIComponent(name)}.png`;

        await db.games.add({ type: currentType, name, data: buffer, cover });
        drawLibrary();
    }

    async function launch(game) {
        document.getElementById('emu-screen').style.display = 'block';
        const cores = { nes:'fceumm', snes:'snes9x', gba:'mgba', gbc:'gambatte', sega:'genesis_plus_gx', ps1:'pcsx_rearmed', n64:'mupen64plus_next' };

        try {
            emuInstance = await nostalgist.Nostalgist.launch({
                core: cores[game.type],
                rom: new Blob([game.data]),
                element: document.querySelector('#emu-canvas')
            });

            if ('ontouchstart' in window) document.getElementById('touch-ui').style.display = 'flex';
            document.documentElement.requestFullscreen().catch(()=>{});
        } catch(err) {
            console.error(err);
            alert("Ошибка запуска! Проверьте, что вы открыли сайт по ссылке https://...");
            quitGame();
        }
    }

    function quitGame() {
        if(emuInstance) { emuInstance.exit(); emuInstance = null; }
        document.getElementById('emu-screen').style.display = 'none';
        if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
    }

    // Блокировка меню на кнопках
    document.querySelectorAll('.t-btn').forEach(b => b.oncontextmenu = (e) => e.preventDefault());
</script>
</body>
</html>
