<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RetroStation Extreme (PS2 Experimental)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700;800&display=swap');
        
        body { background: #020617; color: white; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; }
        .font-brand { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        
        #game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        @media (min-width: 768px) { #game-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); } }

        .game-card { transition: 0.3s; position: relative; border-radius: 15px; overflow: hidden; background: #1e293b; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .game-card:hover { transform: translateY(-5px); border-color: #3b82f6; }
        
        .delete-btn { 
            position: absolute; top: 8px; right: 8px; 
            background: rgba(239, 68, 68, 0.9); width: 28px; height: 28px; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            z-index: 20; font-weight: bold;
        }

        .active-filter { background: #3b82f6 !important; color: white; }

        #emulator-container { display: none; position: fixed; inset: 0; z-index: 9999; background: #000; }

        /* --- PLAYSTATION UI (СИМВОЛЫ) --- */
        .is-psx [data-button], .is-ps2 [data-button] { color: transparent !important; position: relative; }
        .is-psx [data-button]::after, .is-ps2 [data-button]::after {
            position: absolute; inset: 0; display: flex; 
            align-items: center; justify-content: center; 
            color: white !important; font-size: 20px; visibility: visible; font-weight: bold;
        }
        .is-psx [data-button="a"]::after, .is-ps2 [data-button="a"]::after { content: "✖"; color: #88aaff !important; }
        .is-psx [data-button="b"]::after, .is-ps2 [data-button="b"]::after { content: "●"; color: #ff8888 !important; }
        .is-psx [data-button="x"]::after, .is-ps2 [data-button="x"]::after { content: "■"; color: #ffcc88 !important; }
        .is-psx [data-button="y"]::after, .is-ps2 [data-button="y"]::after { content: "▲"; color: #88ff88 !important; }

        /* Надписи L1, R1, L2, R2 */
        .is-psx [data-button="l"]::after, .is-ps2 [data-button="l"]::after { content: "L1"; font-size: 12px; }
        .is-psx [data-button="r"]::after, .is-ps2 [data-button="r"]::after { content: "R1"; font-size: 12px; }
        .is-psx [data-button="l2"]::after, .is-ps2 [data-button="l2"]::after { content: "L2"; font-size: 12px; }
        .is-psx [data-button="r2"]::after, .is-ps2 [data-button="r2"]::after { content: "R2"; font-size: 12px; }

        /* Принудительный показ L2/R2 */
        .is-psx [data-button="l2"], .is-psx [data-button="r2"],
        .is-ps2 [data-button="l2"], .is-ps2 [data-button="r2"] { 
            display: flex !important; visibility: visible !important; opacity: 1 !important; 
        }

        .emu-ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 10000; pointer-events: none; }
        .emu-ui button { pointer-events: auto; background: rgba(0,0,0,0.6); color: white; padding: 8px 15px; border-radius: 10px; font-size: 11px; font-weight: bold; }

        .cover-art { aspect-ratio: 3/4; background: linear-gradient(45deg, #0f172a, #1e293b); display: flex; align-items: center; justify-content: center; text-align: center; padding: 15px; font-size: 12px; font-weight: 800; border-bottom: 3px solid #3b82f6; text-transform: uppercase; color: #94a3b8; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

<div id="ui-layer" class="p-5 max-w-7xl mx-auto">
    <header class="flex flex-col md:flex-row justify-between items-center gap-6 mb-10 text-center md:text-left">
        <div>
            <h1 class="text-4xl font-brand italic text-blue-500 tracking-tighter">RETRO STATION</h1>
            <p id="bios-status" class="text-[9px] text-red-500 font-bold mt-1 uppercase">BIOS PS1/PS2 не установлен</p>
        </div>
        <div class="flex flex-wrap gap-2 justify-center">
            <button onclick="toggleFullScreen()" class="glass px-4 py-3 rounded-xl text-xs font-bold uppercase">Экран</button>
            <button onclick="document.getElementById('fileInput').click()" class="bg-blue-600 px-6 py-3 rounded-xl font-black text-sm shadow-lg">+ ДОБАВИТЬ ИГРЫ</button>
            <button onclick="document.getElementById('biosInput').click()" class="glass px-4 py-3 rounded-xl text-xs">BIOS</button>
        </div>
    </header>

    <!-- Выбор консоли -->
    <div class="flex gap-2 overflow-x-auto no-scrollbar pb-6 mb-4">
        <button onclick="filterSystem('all', this)" class="filter-btn active-filter glass px-6 py-2 rounded-full text-xs font-bold uppercase tracking-widest">Все</button>
        <button onclick="filterSystem('ps2', this)" class="filter-btn glass px-6 py-2 rounded-full text-xs font-bold text-blue-400 uppercase tracking-widest italic">PlayStation 2</button>
        <button onclick="filterSystem('psx', this)" class="filter-btn glass px-6 py-2 rounded-full text-xs font-bold text-indigo-400 uppercase tracking-widest italic">PS1</button>
        <button onclick="filterSystem('n64', this)" class="filter-btn glass px-6 py-2 rounded-full text-xs font-bold text-red-400 uppercase tracking-widest">N64</button>
        <button onclick="filterSystem('dos', this)" class="filter-btn glass px-6 py-2 rounded-full text-xs font-bold text-orange-400 uppercase tracking-widest">MS-DOS</button>
        <button onclick="filterSystem('gba', this)" class="filter-btn glass px-6 py-2 rounded-full text-xs font-bold text-green-400 uppercase tracking-widest">GBA</button>
    </div>

    <div id="game-grid"></div>
</div>

<div id="emulator-container">
    <div class="emu-ui">
        <button onclick="stopEmulator()" style="color: #ff4d4d;">ВЫЙТИ</button>
        <button onclick="alert('PS2 (Play!) - Экспериментальное ядро.\nМожет работать медленно или не запускаться на телефонах.')">PS2 INFO</button>
    </div>
    <div id="game" style="width:100%; height:100%;"></div>
</div>

<input type="file" id="fileInput" class="hidden" multiple accept=".nes,.snes,.gba,.md,.bin,.cue,.chd,.iso,.n64,.zip,.exe" onchange="addGames(event)">
<input type="file" id="biosInput" class="hidden" onchange="addBios(event)">

<script>
    const db = new Dexie("ExtremeEmuDB");
    db.version(2).stores({ games: '++id, title, system, romBlob', config: 'name, blob' });

    const systemMap = {
        'nes': 'nes', 'snes': 'snes', 'md': 'segaMD', 'bin': 'psx', 'chd': 'psx', 
        'cue': 'psx', 'gba': 'gba', 'n64': 'n64', 'zip': 'mame', 'exe': 'dos'
    };

    async function renderGames(filter = 'all') {
        const grid = document.getElementById('game-grid');
        grid.innerHTML = '';
        const games = await db.games.toArray();
        const filtered = filter === 'all' ? games : games.filter(g => g.system === filter);

        filtered.forEach(game => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.innerHTML = `
                <div class="delete-btn shadow-lg" onclick="deleteGame(event, ${game.id})">×</div>
                <div onclick="startEmulator(${game.id})">
                    <div class="cover-art">${game.title}</div>
                    <div class="p-3 text-center">
                        <div class="text-[9px] text-blue-400 font-black uppercase">${game.system}</div>
                        <div class="truncate text-xs font-bold opacity-80">${game.title}</div>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    async function addGames(event) {
        for (const file of event.target.files) {
            const ext = file.name.split('.').pop().toLowerCase();
            let system = systemMap[ext] || 'nes';
            
            // Если расширение ISO, спрашиваем PS1 или PS2
            if (ext === 'iso') {
                system = confirm(`Это игра для PlayStation 2?\n(Нажмите "ОК" для PS2, "Отмена" для PS1)`) ? 'play' : 'psx';
            }
            
            await db.games.add({ title: file.name.replace(/\.[^/.]+$/, ""), system, romBlob: file });
        }
        renderGames();
    }

    async function deleteGame(e, id) {
        e.stopPropagation();
        if(confirm("Удалить игру?")) { await db.games.delete(id); renderGames(); }
    }

    async function addBios(event) {
        if (event.target.files[0]) {
            await db.config.put({ name: 'ps_bios', blob: event.target.files[0] });
            alert("BIOS сохранен!");
            location.reload();
        }
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    }

    async function startEmulator(gameId) {
        const game = await db.games.get(gameId);
        const container = document.getElementById('emulator-container');
        
        container.classList.remove('is-psx', 'is-ps2');
        if (game.system === 'psx') container.classList.add('is-psx');
        if (game.system === 'play') container.classList.add('is-ps2');

        container.style.display = 'block';
        
        window.EJS_player = '#game';
        window.EJS_gameUrl = URL.createObjectURL(game.romBlob);
        window.EJS_core = game.system; // 'play' для PS2
        window.EJS_pathtodata = 'https://rawcdn.githack.com/EmulatorJS/EmulatorJS/main/data/';
        window.EJS_startOnLoad = true;

        window.EJS_buttons = {
            l: true, r: true, l2: true, r2: true,
            l3: true, r3: true,
            leftStick: true, rightStick: true,
            select: true, start: true
        };

        if (game.system === 'psx' || game.system === 'play') {
            const bios = await db.config.get('ps_bios');
            if (bios) window.EJS_biosUrl = URL.createObjectURL(bios.blob);
            window.EJS_defaultControllerType = 5; 
        }

        const script = document.createElement('script');
        script.src = 'https://rawcdn.githack.com/EmulatorJS/EmulatorJS/main/data/loader.js';
        document.body.appendChild(script);
    }

    function stopEmulator() { location.reload(); }
    function filterSystem(sys, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active-filter'));
        btn.classList.add('active-filter');
        renderGames(sys === 'ps2' ? 'play' : sys);
    }

    db.config.get('ps_bios').then(bios => {
        if(bios) document.getElementById('bios-status').innerHTML = "🟢 PS BIOS READY";
    });

    renderGames();
</script>

</body>
</html>
