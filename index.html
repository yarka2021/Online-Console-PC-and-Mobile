<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RetroStation: PS5 Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        
        :root {
            --ps-blue: #00439c;
            --theme-color: #00439c;
            --bg-dark: #000205;
        }

        body { 
            background-color: var(--bg-dark); 
            color: white; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            overflow-x: hidden;
            user-select: none;
        }

        /* Живой фон */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at top right, var(--theme-color), transparent 40%),
                        radial-gradient(circle at bottom left, #000, transparent 50%);
            transition: --theme-color 1s ease;
        }

        .glass { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }

        .game-card {
            position: relative;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            border-radius: 12px;
            transform-origin: center;
        }

        .game-card:hover {
            transform: scale(1.08);
            z-index: 50;
            box-shadow: 0 0 30px var(--theme-color);
            border: 2px solid white;
        }

        .game-card.favorite::before {
            content: '★';
            position: absolute; top: 10px; left: 10px;
            color: #ffd700; font-size: 20px; z-index: 10;
            text-shadow: 0 0 10px black;
        }

        /* Категории PS5 Style */
        .filter-btn {
            position: relative;
            padding: 10px 20px;
            font-weight: 600;
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            transition: 0.3s;
        }
        .filter-btn.active {
            color: white;
            transform: scale(1.1);
        }
        .filter-btn.active::after {
            content: '';
            position: absolute; bottom: -5px; left: 50%;
            width: 5px; height: 5px; background: white;
            border-radius: 50%; transform: translateX(-50%);
        }

        #emulator-container { display: none; position: fixed; inset: 0; z-index: 9999; background: #000; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div id="ui-layer" class="p-6 md:p-16 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="flex justify-between items-center mb-12">
        <div class="flex items-center gap-4">
            <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center font-bold text-xl glass">P</div>
            <h1 class="text-2xl font-light tracking-widest uppercase">Retro Station <span class="font-black">5</span></h1>
        </div>
        <div class="flex gap-3">
            <button onclick="exportLibrary()" class="glass p-3 rounded-full hover:bg-white/10 transition" title="Backup (Облако)">☁️</button>
            <button onclick="document.getElementById('fileInput').click()" class="glass px-6 py-2 rounded-full font-bold text-sm hover:bg-white/20 transition">Добавить игру</button>
            <button onclick="document.getElementById('biosInput').click()" class="glass p-2 rounded-full text-xs">BIOS</button>
        </div>
    </header>

    <!-- Поиск (скрыт если < 15 игр) -->
    <div id="search-container" class="hidden mb-8">
        <input type="text" id="searchInput" oninput="searchGames()" placeholder="Поиск по библиотеке..." class="w-full max-w-md glass bg-white/5 border-none rounded-xl px-6 py-3 text-white focus:ring-2 focus:ring-blue-500 outline-none">
    </div>

    <!-- Категории -->
    <nav class="flex gap-6 overflow-x-auto no-scrollbar mb-10 pb-4">
        <button onclick="setFilter('all', this, '#00439c')" class="filter-btn active">Все игры</button>
        <button onclick="setFilter('favorite', this, '#ffd700')" class="filter-btn">Избранное</button>
        <button onclick="setFilter('psx', this, '#00439c')" class="filter-btn">PlayStation</button>
        <button onclick="setFilter('nds', this, '#ff4d4d')" class="filter-btn">Nintendo DS</button>
        <button onclick="setFilter('gba', this, '#22c55e')" class="filter-btn">Game Boy</button>
        <button onclick="setFilter('snes', this, '#ef4444')" class="filter-btn">SNES</button>
        <button onclick="setFilter('segaMD', this, '#3b82f6')" class="filter-btn">Sega</button>
    </nav>

    <!-- Сетка игр -->
    <div id="game-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 gap-6"></div>
</div>

<div id="emulator-container">
    <div class="absolute top-5 left-5 z-[10000] flex gap-2">
        <button onclick="stopEmulator()" class="glass px-6 py-2 rounded-xl font-bold text-red-500">ВЫЙТИ</button>
    </div>
    <div id="game" style="width:100%; height:100%;"></div>
</div>

<input type="file" id="fileInput" class="hidden" multiple onchange="addGames(event)">
<input type="file" id="biosInput" class="hidden" onchange="addBios(event)">

<script>
    const db = new Dexie("PS5RetroStore");
    db.version(2).stores({ 
        games: '++id, title, system, romBlob, isFavorite, cover', 
        config: 'name, blob' 
    });

    let currentFilter = 'all';

    // --- Живой фон (Анимация частиц) ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function initParticles() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        particles = [];
        for(let i=0; i<60; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speedX: (Math.random() - 0.5) * 0.5,
                speedY: (Math.random() - 0.5) * 0.5,
                alpha: Math.random()
            });
        }
    }

    function animateBackground() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            p.x += p.speedX;
            p.y += p.speedY;
            if(p.x > canvas.width) p.x = 0;
            if(p.y > canvas.height) p.y = 0;
            ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        });
        requestAnimationFrame(animateBackground);
    }

    // Изменение цвета темы
    function setFilter(sys, btn, color) {
        currentFilter = sys;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.documentElement.style.setProperty('--theme-color', color);
        renderGames();
    }

    // --- Логика Игр ---
    const systemMap = {
        'nes': 'nes', 'snes': 'snes', 'sfc': 'snes', 'smc': 'snes',
        'md': 'segaMD', 'gen': 'segaMD', 'bin': 'psx', 'chd': 'psx', 
        'iso': 'psx', 'cue': 'psx', 'gba': 'gba', 'gb': 'gb', 'gbc': 'gbc',
        'n64': 'n64', 'nds': 'nds', 'sms': 'segaMS', 'gg': 'segaGG',
        'pce': 'pce', 'a26': 'atari2600', 'ngc': 'ngp'
    };

    async function addGames(event) {
        for (const file of event.target.files) {
            const ext = file.name.split('.').pop().toLowerCase();
            let system = systemMap[ext] || 'nes';
            if (ext === 'iso') system = confirm("PlayStation 2?") ? 'play' : 'psx';
            
            const title = file.name.replace(/\.[^/.]+$/, "");
            
            // Авто-поиск обложки (через API Libretro или Google Search Proxy)
            const coverUrl = `https://raw.githubusercontent.com/libretro-thumbnails/libretro-thumbnails/master/${getSystemName(system)}/Named_Boxarts/${encodeURIComponent(title)}.png`;

            await db.games.add({ 
                title: title, 
                system, 
                romBlob: file, 
                isFavorite: 0,
                cover: coverUrl 
            });
        }
        renderGames();
    }

    function getSystemName(sys) {
        const names = {'psx': 'Sony_-_PlayStation', 'snes': 'Nintendo_-_Super_Nintendo_Entertainment_System', 'nes': 'Nintendo_-_Nintendo_Entertainment_System', 'gba': 'Nintendo_-_Game_Boy_Advance', 'gb': 'Nintendo_-_Game_Boy'};
        return names[sys] || 'Sony_-_PlayStation';
    }

    async function renderGames() {
        const grid = document.getElementById('game-grid');
        grid.innerHTML = '';
        const games = await db.games.toArray();

        // Показ поиска если игр >= 15
        document.getElementById('search-container').classList.toggle('hidden', games.length < 15);

        let filtered = games;
        if(currentFilter === 'favorite') filtered = games.filter(g => g.isFavorite);
        else if(currentFilter !== 'all') filtered = games.filter(g => g.system === (currentFilter === 'ps2' ? 'play' : currentFilter));

        filtered.forEach(game => {
            const card = document.createElement('div');
            card.className = `game-card glass overflow-hidden ${game.isFavorite ? 'favorite' : ''}`;
            card.innerHTML = `
                <div class="aspect-[3/4] bg-gray-900 relative">
                    <img src="${game.cover}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/300x400/001/fff?text=${encodeURIComponent(game.title)}'">
                    <div class="absolute bottom-0 inset-x-0 p-3 bg-gradient-to-t from-black to-transparent">
                        <div class="text-[10px] font-bold text-blue-400 uppercase">${game.system}</div>
                        <div class="text-sm font-bold truncate">${game.title}</div>
                    </div>
                </div>
                <div class="flex justify-between p-2 glass border-none">
                    <button onclick="toggleFav(event, ${game.id})" class="hover:scale-120 transition">⭐</button>
                    <button onclick="deleteGame(event, ${game.id})" class="text-red-500 opacity-50 hover:opacity-100">×</button>
                </div>
            `;
            card.onclick = () => startEmulator(game.id);
            grid.appendChild(card);
        });
    }

    async function toggleFav(e, id) {
        e.stopPropagation();
        const game = await db.games.get(id);
        await db.games.update(id, { isFavorite: game.isFavorite ? 0 : 1 });
        renderGames();
    }

    async function deleteGame(e, id) {
        e.stopPropagation();
        if(confirm("Удалить?")) { await db.games.delete(id); renderGames(); }
    }

    // Поиск
    function searchGames() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const cards = document.querySelectorAll('.game-card');
        cards.forEach(card => {
            const title = card.innerText.toLowerCase();
            card.style.display = title.includes(query) ? 'block' : 'none';
        });
    }

    // Экспорт (Облачное сохранение)
    async function exportLibrary() {
        const games = await db.games.toArray();
        const data = JSON.stringify(games);
        const blob = new Blob([data], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `retro_station_backup_${new Date().toLocaleDateString()}.json`;
        a.click();
        alert("Бэкап создан! Сохраните этот файл в облако. Чтобы восстановить — просто перетащите его на кнопку 'Добавить'.");
    }

    // Запуск Эмулятора
    async function startEmulator(gameId) {
        const game = await db.games.get(gameId);
        document.getElementById('emulator-container').style.display = 'block';
        
        window.EJS_player = '#game';
        window.EJS_gameUrl = URL.createObjectURL(game.romBlob);
        window.EJS_core = game.system;
        window.EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/';
        window.EJS_startOnLoad = true;
        
        if (/Android|iPhone|iPad/i.test(navigator.userAgent)) window.EJS_browserMode = 'mobile';
        
        window.EJS_buttons = { l: true, r: true, l2: true, r2: true, l3: true, r3: true, leftStick: true, rightStick: true, select: true, start: true };

        if (game.system === 'psx' || game.system === 'play') {
            const bios = await db.config.get('ps_bios');
            if (bios) window.EJS_biosUrl = URL.createObjectURL(bios.blob);
            window.EJS_defaultControllerType = 5; 
            document.getElementById('emulator-container').classList.add('is-psx');
        }

        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/loader.js';
        document.body.appendChild(script);
    }

    function stopEmulator() { location.reload(); }
    function toggleFullScreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    }

    initParticles();
    animateBackground();
    renderGames();
    window.addEventListener('resize', initParticles);
</script>

<!-- Стили кнопок PS1 перенесены из прошлой версии -->
<style>
    .is-psx [data-button]::after { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: white !important; font-size: 22px; visibility: visible; font-weight: bold; }
    .is-psx [data-button="a"]::after { content: "✖"; color: #88aaff !important; }
    .is-psx [data-button="b"]::after { content: "●"; color: #ff8888 !important; }
    .is-psx [data-button="x"]::after { content: "■"; color: #ffcc88 !important; }
    .is-psx [data-button="y"]::after { content: "▲"; color: #88ff88 !important; }
    .is-psx [data-button] { color: transparent !important; }
</style>

</body>
</html>
