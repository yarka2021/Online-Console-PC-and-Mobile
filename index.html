<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N64 Retro Station</title>
    <script src="https://cdn.jsdelivr.net/gh/ethanahearn/emulatorjs@latest/dist/emulator.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-purple: #bc13fe;
            --bg-dark: #0a0a0c;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a0c 100%);
        }

        /* Анимированный фон с сеткой */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(188, 19, 254, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(188, 19, 254, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg);
            transform-origin: center top;
            z-index: -1;
            animation: grid-move 10s linear infinite;
        }

        @keyframes grid-move {
            from { background-position: 0 0; }
            to { background-position: 0 50px; }
        }

        header {
            margin-top: 2rem;
            text-align: center;
            text-shadow: 0 0 10px var(--neon-blue);
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.5rem;
            color: var(--neon-blue);
            margin-bottom: 10px;
        }

        /* Контейнер эмулятора */
        #game-container {
            width: 800px;
            height: 600px;
            max-width: 95vw;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--neon-purple);
            box-shadow: 0 0 20px rgba(188, 19, 254, 0.5), inset 0 0 15px rgba(0, 242, 255, 0.2);
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn-upload {
            background: transparent;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 10px 20px;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 5px;
            font-weight: bold;
        }

        .btn-upload:hover {
            background: var(--neon-blue);
            color: black;
            box-shadow: 0 0 15px var(--neon-blue);
        }

        input[type="file"] {
            display: none;
        }

        #status {
            font-size: 0.8rem;
            color: #888;
            margin-top: 10px;
        }

        .instructions {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 600px;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        span.key {
            color: var(--neon-purple);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>N64 ULTRA CORE</h1>
        <p>WEB EMULATION STATION</p>
    </header>

    <div id="game-container">
        <div id="placeholder">
            <p style="text-align: center; color: #555;">Ожидание загрузки ROM...<br>Нажмите кнопку ниже</p>
        </div>
        <div id="emulator" style="width:100%; height:100%;"></div>
    </div>

    <div class="controls">
        <label class="btn-upload">
            Выбрать игру (.n64, .z64)
            <input type="file" id="rom-input" accept=".n64,.z64,.v64">
        </label>
    </div>

    <div class="instructions">
        <div style="text-align: center; margin-bottom: 10px; color: var(--neon-blue);">УПРАВЛЕНИЕ:</div>
        • <b>Стики:</b> Стрелки клавиатуры | <b>Кнопки A/B:</b> X / C<br>
        • <b>Кнопки C:</b> I / J / K / L | <b>Z-триггер:</b> Z<br>
        • <b>Start:</b> Enter | <b>L/R:</b> Q / E
    </div>

    <p id="status">Powered by EmulatorJS & Mupen64Plus</p>

    <script>
        const romInput = document.getElementById('rom-input');
        const placeholder = document.getElementById('placeholder');

        romInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            placeholder.style.display = 'none';
            
            const reader = new FileReader();
            reader.onload = function(event) {
                const romData = event.target.result;
                
                // Инициализация эмулятора
                window.EJS_player = '#emulator';
                window.EJS_core = 'n64'; // Ядро Nintendo 64
                window.EJS_gameName = file.name;
                window.EJS_color = '#bc13fe';
                window.EJS_startOnLoaded = true;
                window.EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/ethanahearn/emulatorjs@latest/dist/data/';
                window.EJS_gameUrl = URL.createObjectURL(new Blob([romData]));

                // Загрузка загрузчика эмулятора
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/gh/ethanahearn/emulatorjs@latest/dist/loader.js';
                document.body.appendChild(script);
            };
            reader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
