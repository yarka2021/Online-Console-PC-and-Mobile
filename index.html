<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RetroStation Trinity</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        
        :root { --accent: #00439c; --bg: #000205; --radius: 12px; }

        /* ТЕМЫ */
        body.theme-ps5 { --accent: #00439c; --bg: #00050f; --radius: 15px; --font: 'Inter'; }
        body.theme-switch { --accent: #e60012; --bg: #2d2d2d; --radius: 4px; --font: 'Inter'; }
        body.theme-xbox { --accent: #107c10; --bg: #050505; --radius: 0px; --font: 'Inter'; }

        body { 
            background-color: var(--bg); 
            color: white; 
            font-family: var(--font), sans-serif; 
            margin: 0; 
            overflow-x: hidden; 
            transition: all 0.5s ease;
        }

        #bg-canvas { position: fixed; inset: 0; z-index: -1; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        
        /* Сетка игр */
        .game-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
            gap: 20px; 
            padding: 20px;
        }

        .game-card {
            aspect-ratio: 1/1;
            background: #111;
            border-radius: var(--radius);
            border: 3px solid transparent;
            transition: 0.3s cubic-bezier(0.17, 0.88, 0.32, 1.28);
            position: relative;
            overflow: hidden;
        }

        .game-card:hover {
            transform: scale(1.1);
            border-color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 15px var(--accent);
            z-index: 10;
        }

        /* Панель выбора консолей */
        .console-nav {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 20px;
            scrollbar-width: none;
        }
        .console-nav::-webkit-scrollbar { display: none; }

        .console-btn {
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
            background: rgba(255,255,255,0.05);
            transition: 0.3s;
            border: 1px solid transparent;
        }
        .console-btn.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 0 15px var(--accent);
        }

        /* Статус-бар */
        .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; }

        #emulator-container { display: none; position: fixed; inset: 0; z-index: 9999; background: #000; }

        /* PS Symbols */
        .is-psx [data-button]::after { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: white !important; font-size: 24px; visibility: visible; font-weight: 900; }
        .is-psx [data-button="a"]::after { content: "✖"; color: #88aaff !important; }
        .is-psx [data-button="b"]::after { content: "●"; color: #ff8888 !important; }
        .is-psx [data-button="x"]::after { content: "■"; color: #ffcc88 !important; }
        .is-psx [data-button="y"]::after { content: "▲"; color: #88ff88 !important; }
        .is-psx [data-button] { color: transparent !important; }

        @media (max-width: 768px) {
            .game-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
            .status-bar { padding: 15px 20px; }
        }
    </style>
</head>
<body class="theme-ps5">

<canvas id="bg-canvas"></canvas>

<!-- Top Navigation -->
<div class="status-bar">
    <div class="flex items-center gap-4">
        <div class="w-10 h-10 rounded-full glass flex items-center justify-center font-black">H</div>
        <h1 id="brand-logo" class="text-lg font-bold tracking-tighter uppercase">RetroStation <span id="ver-tag">5</span></h1>
    </div>
    
    <div class="flex items-center gap-4">
        <div class="theme-selector flex gap-2 glass p-1.5 rounded-full">
            <button onclick="changeTheme('ps5')" class="w-5 h-5 rounded-full bg-blue-600 border border-white/20"></button>
            <button onclick="changeTheme('switch')" class="w-5 h-5 rounded-full bg-red-600 border border-white/20"></button>
            <button onclick="changeTheme('xbox')" class="w-5 h-5 rounded-full bg-green-600 border border-white/20"></button>
        </div>
        <span id="clock" class="font-mono text-sm opacity-60">12:00</span>
    </div>
</div>

<!-- Console Filter Bar (ВОТ ОНИ) -->
<div class="console-nav" id="console-filters">
    <button onclick="setFilter('all', this)" class="console-btn active">Все</button>
    <button onclick="setFilter('favorite', this)" class="console-btn">⭐ Избранное</button>
    <button onclick="setFilter('psx', this)" class="console-btn">PS1</button>
    <button onclick="setFilter('play', this)" class="console-btn">PS2</button>
    <button onclick="setFilter('gba', this)" class="console-btn">GBA</button>
    <button onclick="setFilter('nds', this)" class="console-btn">NDS</button>
    <button onclick="setFilter('nes', this)" class="console-btn">NES</button>
    <button onclick="setFilter('snes', this)" class="console-btn">SNES</button>
    <button onclick="setFilter('segaMD', this)" class="console-btn">Sega</button>
    <button onclick="setFilter('mame', this)" class="console-btn">MAME</button>
    <button onclick="setFilter('dos', this)" class="console-btn">DOS</button>
    <button onclick="setFilter('pce', this)" class="console-btn">PC Engine</button>
</div>

<!-- Main UI -->
<div id="ui-layer" class="min-h-screen">
    <div class="px-6 py-4 flex justify-between items-center">
        <h2 id="section-title" class="text-2xl font-black uppercase italic tracking-widest opacity-80">Библиотека</h2>
        <div class="flex gap-2">
            <button onclick="exportLibrary()" class="glass px-4 py-2 rounded-full text-[10px] font-bold">BACKUP</button>
            <button onclick="document.getElementById('fileInput').click()" class="bg-white text-black px-6 py-2 rounded-full text-[10px] font-bold uppercase">Добавить</button>
        </div>
    </div>

    <div id="game-grid" class="game-grid">
        <!-- Игры -->
    </div>
</div>

<div id="emulator-container">
    <button onclick="stopEmulator()" class="absolute top-5 left-5 z-[10000] glass px-6 py-2 rounded-full font-bold text-white uppercase text-xs">Выйти</button>
    <div id="game" style="width:100%; height:100%;"></div>
</div>

<input type="file" id="fileInput" class="hidden" multiple onchange="addGames(event)">
<input type="file" id="biosInput" class="hidden" onchange="addBios(event)">

<script>
    const db = new Dexie("RetroTrinityDB");
    db.version(1).stores({ games: '++id, title, system, romBlob, isFavorite, cover', config: 'name, blob' });

    let currentFilter = 'all';
    const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);

    // --- Background Engine ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function initParticles() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        particles = [];
        let count = 40;
        for(let i=0; i<count; i++) particles.push({ 
            x: Math.random() * canvas.width, y: Math.random() * canvas.height, 
            size: Math.random() * 2 + 1, speedX: (Math.random()-0.5)*0.3, speedY: (Math.random()-0.5)*0.3, 
            alpha: Math.random() 
        });
    }
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const theme = document.body.className;
        particles.forEach(p => {
            p.x += p.speedX; p.y += p.speedY;
            if(p.x > canvas.width) p.x = 0; if(p.y > canvas.height) p.y = 0;
            ctx.fillStyle = theme.includes('ps5') ? `rgba(255,255,255,${p.alpha * 0.4})` : (theme.includes('xbox') ? `rgba(16, 124, 16, ${p.alpha})` : `rgba(255,255,255,0.1)`);
            ctx.beginPath();
            if(theme.includes('xbox')) ctx.rect(p.x, p.y, p.size*2, p.size*2);
            else ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        });
        requestAnimationFrame(animate);
    }

    // --- UI & Theme Logic ---
    function changeTheme(theme) {
        document.body.className = 'theme-' + theme;
        document.getElementById('ver-tag').innerText = theme === 'ps5' ? '5' : (theme === 'switch' ? 'Switch' : 'Series X');
        localStorage.setItem('retro-theme', theme);
        initParticles();
    }

    function setFilter(sys, btn) {
        currentFilter = sys;
        document.querySelectorAll('.console-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGames();
    }

    // --- Game Logic ---
    const systemMap = {
        'nes': 'nes', 'sfc': 'snes', 'snes': 'snes', 'md': 'segaMD', 'gen': 'segaMD',
        'bin': 'psx', 'chd': 'psx', 'iso': 'psx', 'gba': 'gba', 'gb': 'gb', 'gbc': 'gbc', 
        'n64': 'n64', 'nds': 'nds', 'sms': 'segaMS', 'gg': 'segaGG', 'pce': 'pce', 'zip': 'mame'
    };

    async function addGames(event) {
        for (const file of event.target.files) {
            const ext = file.name.split('.').pop().toLowerCase();
            let system = systemMap[ext] || 'nes';
            if (ext === 'iso' && file.size > 500000000) system = confirm("PlayStation 2?") ? 'play' : 'psx';
            
            const title = file.name.replace(/\.[^/.]+$/, "");
            const coverUrl = `https://raw.githubusercontent.com/libretro-thumbnails/libretro-thumbnails/master/${getLibName(system)}/Named_Boxarts/${encodeURIComponent(title)}.png`;
            await db.games.add({ title, system, romBlob: file, isFavorite: 0, cover: coverUrl });
        }
        renderGames();
    }

    function getLibName(sys) {
        const map = {'psx':'Sony_-_PlayStation','nes':'Nintendo_-_Nintendo_Entertainment_System','snes':'Nintendo_-_Super_Nintendo_Entertainment_System','gba':'Nintendo_-_Game_Boy_Advance'};
        return map[sys] || 'Sony_-_PlayStation';
    }

    async function renderGames() {
        const grid = document.getElementById('game-grid');
        grid.innerHTML = '';
        const games = await db.games.toArray();
        let filtered = games;
        if(currentFilter === 'favorite') filtered = games.filter(g => g.isFavorite);
        else if(currentFilter !== 'all') filtered = games.filter(g => g.system === currentFilter);

        filtered.forEach(game => {
            const card = document.createElement('div');
            card.className = `game-card glass group`;
            card.innerHTML = `
                <img src="${game.cover}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/300?text=${encodeURIComponent(game.title)}'">
                <div class="absolute bottom-0 inset-x-0 p-3 bg-gradient-to-t from-black to-transparent opacity-0 group-hover:opacity-100 transition">
                    <div class="text-[8px] font-bold text-blue-400 uppercase">${game.system}</div>
                    <div class="text-[10px] font-bold truncate">${game.title}</div>
                </div>
                <button onclick="toggleFav(event, ${game.id})" class="absolute top-2 right-2">${game.isFavorite ? '⭐' : '☆'}</button>
                <button onclick="deleteGame(event, ${game.id})" class="absolute top-2 left-2 opacity-0 group-hover:opacity-100 text-red-500">🗑️</button>
            `;
            card.onclick = () => startEmulator(game.id);
            grid.appendChild(card);
        });
    }

    async function startEmulator(id) {
        const game = await db.games.get(id);
        document.getElementById('emulator-container').style.display = 'block';
        window.EJS_player = '#game';
        window.EJS_gameUrl = URL.createObjectURL(game.romBlob);
        window.EJS_core = game.system;
        window.EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/';
        window.EJS_startOnLoad = true;
        if (isMobile) window.EJS_browserMode = 'mobile';
        window.EJS_buttons = { l: true, r: true, l2: true, r2: true, l3: true, r3: true, leftStick: true, rightStick: true, select: true, start: true };
        
        if (game.system.includes('ps') || game.system === 'play') {
            const bios = await db.config.get('ps_bios');
            if (bios) window.EJS_biosUrl = URL.createObjectURL(bios.blob);
            window.EJS_defaultControllerType = 5; 
            document.getElementById('emulator-container').classList.add('is-psx');
        }

        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/loader.js';
        document.body.appendChild(script);
    }

    // --- Helpers ---
    function updateClock() { const now = new Date(); document.getElementById('clock').innerText = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0'); }
    async function toggleFav(e, id) { e.stopPropagation(); const g = await db.games.get(id); await db.games.update(id, {isFavorite: g.isFavorite ? 0 : 1}); renderGames(); }
    async function deleteGame(e, id) { e.stopPropagation(); if(confirm("Удалить?")) { await db.games.delete(id); renderGames(); } }
    function stopEmulator() { location.reload(); }
    async function exportLibrary() { const g = await db.games.toArray(); const b = new Blob([JSON.stringify(g)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `retro_backup.json`; a.click(); }
    async function addBios(event) { if (event.target.files[0]) { await db.config.put({ name: 'ps_bios', blob: event.target.files[0] }); alert("BIOS Saved"); } }

    const savedTheme = localStorage.getItem('retro-theme') || 'ps5';
    changeTheme(savedTheme);
    initParticles(); animate(); renderGames(); setInterval(updateClock, 1000);
    window.addEventListener('resize', initParticles);
</script>
</body>
</html>
