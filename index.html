<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RetroStation OS: Ultimate Creative</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Inter:wght@100;400;900&display=swap');
        :root { --neon: #00f2ff; --accent: #00439c; --bg: #000; }
        *{box-sizing:border-box; margin:0; padding:0; cursor: none !important;}
        body { background-color: #000; color: white; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; perspective: 2000px; }
        
        /* ТЕМЫ */
        body.theme-ps5 { --accent: #00439c; --bg: #07101d; }
        body.theme-switch { --accent: #e60012; --bg: #e0e0e0; color: #333; }
        body.theme-xbox { --accent: #107c10; --bg: #001b04; }
        body.theme-gamehub { --accent: #8b5cf6; --bg: #0f111a; }
        body.theme-wii { --accent: #00a8df; --bg: radial-gradient(circle at 50% 0%, #ffffff 0%, #edf0f2 45%, #d9dde0 100%); color: #73797d; }

        /* КУРСОР WII */
        body.is-pc.theme-wii, body.is-pc.theme-wii * { cursor: url("452235.png") 8 2, auto !important; }

        .ui-page { display: none; width: 100%; height: 100%; position: absolute; inset: 0; flex-direction: column; }
        .active-page { display: flex !important; animation: fadeIn 0.5s ease; }

        /* ПАНЕЛЬ КОНСОЛЕЙ */
        .console-nav { display: flex; gap: 8px; overflow-x: auto; padding: 15px 40px; scrollbar-width: none; z-index: 1000; background: rgba(0,0,0,0.2); backdrop-filter: blur(10px); }
        .console-nav::-webkit-scrollbar { display: none; }
        .c-btn { padding: 6px 14px; border-radius: 20px; font-size: 9px; font-weight: 900; text-transform: uppercase; white-space: nowrap; transition: 0.3s; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: inherit; flex-shrink: 0; }
        .c-btn.active { background: var(--accent); color: white !important; border-color: white; box-shadow: 0 0 15px var(--accent); }

        /* 3D КАРУСЕЛЬ */
        #scroller-container { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        #scroller { display: flex; align-items: center; transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1); transform-style: preserve-3d; }
        
        .omni-card { 
            min-width: 300px; height: 420px; background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px; margin: 0 40px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            transition: 0.5s; position: relative;
        }
        .omni-card.active { border-color: var(--neon); box-shadow: 0 0 80px rgba(0, 242, 255, 0.2); transform: translateZ(150px); }
        .card-media { width: 85%; height: 75%; object-fit: cover; border-radius: 20px; pointer-events: none; }

        /* КНОПКА УДАЛЕНИЯ НА КАРТОЧКЕ */
        .card-delete-quick {
            position: absolute; top: 15px; right: 15px; width: 35px; height: 35px;
            background: rgba(239, 68, 68, 0.8); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: 0.3s; z-index: 100;
        }
        .omni-card.active:hover .card-delete-quick { opacity: 1; }

        /* РЕДАКТОР */
        #editor-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 500000; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        .edit-box { width: 90%; max-width: 400px; padding: 30px; border-radius: 30px; border: 1px solid var(--neon); }

        #custom-cursor { position: fixed; width: 30px; height: 30px; border: 1px solid var(--neon); border-radius: 50%; pointer-events: none; z-index: 1000000; display: flex; align-items: center; justify-content: center; transition: 0.05s linear; }
        #emulator-container { display: none; position: fixed; inset: 0; z-index: 200000; background: #000; }
        .theme-tray { position: fixed; top: 50%; right: 20px; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; z-index: 1500; }
        .theme-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; cursor: pointer; }

        /* Sony Layout */
        .is-psx [data-button]::after { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: white !important; font-size: 24px; visibility: visible; font-weight: 900; }
        .is-psx [data-button="a"]::after { content: "✖"; color: #508dff !important; }
        .is-psx [data-button="b"]::after { content: "●"; color: #ff5050 !important; }
        .is-psx [data-button="x"]::after { content: "■"; color: #ffbc50 !important; }
        .is-psx [data-button="y"]::after { content: "▲"; color: #50ff7a !important; }
        .is-psx [data-button] { color: transparent !important; }

        @media screen and (max-width: 900px) and (orientation: portrait) { #rotate-overlay { display: flex !important; } }
        #rotate-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 1000000; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    </style>
</head>
<body class="theme-ps5" onclick="initAether()">

<div id="custom-cursor"></div>

<div id="rotate-overlay">
    <p class="font-bold uppercase tracking-widest animate-pulse">Пожалуйста, поверните телефон</p>
</div>

<!-- РЕДАКТОР -->
<div id="editor-overlay">
    <div class="edit-box glass flex flex-col gap-4">
        <h2 class="font-black italic text-xl uppercase tracking-tighter">Настройка игры</h2>
        <input type="text" id="edit-name" class="bg-white/10 p-3 rounded-xl text-white outline-none border border-white/10">
        <p class="text-[10px] opacity-50 uppercase">Медиа-обложка (Фото/GIF/Видео)</p>
        <button onclick="document.getElementById('mediaInput').click()" class="bg-white/10 p-3 rounded-xl text-xs font-bold">Выбрать файл</button>
        <input type="file" id="mediaInput" class="hidden" accept="image/*,video/*" onchange="previewMedia(event)">
        <input type="text" id="edit-yt" placeholder="YouTube Video ID" class="bg-white/10 p-3 rounded-xl text-white outline-none border border-white/10">
        
        <div class="flex flex-col gap-2 mt-4">
            <button onclick="saveChanges()" class="bg-cyan-500 text-black p-3 rounded-xl font-black uppercase text-xs">Сохранить</button>
            <button onclick="deleteInEditor()" class="bg-red-600 text-white p-3 rounded-xl font-black uppercase text-xs">Удалить игру 🗑️</button>
            <button onclick="closeEditor()" class="bg-white/5 text-white p-2 rounded-xl text-[10px] uppercase">Закрыть</button>
        </div>
    </div>
</div>

<div id="page-home" class="ui-page active-page">
    <header class="flex justify-between items-center px-10 py-6">
        <div class="flex items-center gap-6">
            <div class="w-12 h-12 rounded-xl glass flex items-center justify-center font-black">RS</div>
            <span id="user-display" class="font-black italic text-xl uppercase cursor-pointer" onclick="changeNick()">PLAYER ONE</span>
        </div>
        <div class="flex gap-4">
            <button onclick="switchPage('party')" class="glass px-6 py-2 rounded-full font-bold text-[10px] uppercase">🌐 Party Hub</button>
            <button onclick="document.getElementById('fileInput').click()" class="bg-white text-black px-6 py-2 rounded-full font-bold text-[10px] uppercase">+ Add Game</button>
        </div>
    </header>

    <div class="console-nav" id="filters">
        <div onclick="setFilter('all', this)" class="c-btn active">Все</div>
        <div onclick="setFilter('psx', this)" class="c-btn">PS1</div>
        <div onclick="setFilter('play', this)" class="c-btn">PS2</div>
        <div onclick="setFilter('gba', this)" class="c-btn">GBA</div>
        <div onclick="setFilter('gbc', this)" class="c-btn">GBC</div>
        <div onclick="setFilter('gb', this)" class="c-btn">GB</div>
        <div onclick="setFilter('nes', this)" class="c-btn">NES</div>
        <div onclick="setFilter('snes', this)" class="c-btn">SNES</div>
        <div onclick="setFilter('nds', this)" class="c-btn">NDS</div>
        <div onclick="setFilter('segaMD', this)" class="c-btn">Sega</div>
        <div onclick="setFilter('dos', this)" class="c-btn">DOS</div>
    </div>

    <div id="scroller-container"><div id="scroller"></div></div>

    <div class="px-20 py-8 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-black italic uppercase" id="hud-title">RetroStation</h1>
            <p id="voice-status" class="text-[9px] opacity-40 uppercase tracking-widest italic">Neural System Online</p>
        </div>
        <button onclick="launchCurrent()" class="bg-cyan-500 text-black px-12 py-3 rounded-full font-black uppercase text-sm hover:scale-110 transition">Запустить</button>
    </div>
</div>

<div id="page-party" class="ui-page">
    <header class="flex justify-between items-center px-10 py-6">
        <h1 class="text-3xl font-black italic tracking-tighter uppercase">Party<span class="text-cyan-400">Hub</span></h1>
        <button onclick="switchPage('home')" class="glass px-6 py-2 rounded-full font-bold text-[10px] uppercase">🏠 Назад</button>
    </header>
    <main class="flex-1 px-10 py-4"><div id="lobby-list" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div></main>
</div>

<div id="emulator-container">
    <div id="game" style="width:100%; height:100%;"></div>
    <button onclick="location.reload()" class="absolute top-5 right-5 glass px-6 py-2 rounded-full font-black uppercase text-[10px]">EXIT</button>
</div>

<div class="theme-tray">
    <div class="theme-dot bg-blue-600" onclick="changeTheme('ps5')"></div>
    <div class="theme-dot bg-red-600" onclick="changeTheme('switch')"></div>
    <div class="theme-dot bg-green-600" onclick="changeTheme('xbox')"></div>
</div>

<input type="file" id="fileInput" class="hidden" multiple onchange="importGames(event)">

<script>
    const db = new Dexie("RetroCreativeFinalDB");
    db.version(1).stores({ games: '++id, title, system, romBlob, cover, mediaType, ytId', settings: 'key, val' });

    let games = [], filteredGames = [], currentIndex = 0, audioUnlocked = false, userNick = "PLAYER ONE";
    let editingId = null, tempMedia = null, tempMediaType = 'image';
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    if(!isMobile) document.body.classList.add('is-pc');

    // --- РЕДАКТОР И УДАЛЕНИЕ ---
    function openEditor(game) {
        editingId = game.id;
        document.getElementById('edit-name').value = game.title;
        document.getElementById('edit-yt').value = game.ytId || "";
        tempMedia = game.cover;
        tempMediaType = game.mediaType || 'image';
        document.getElementById('editor-overlay').style.display = 'flex';
    }

    async function deleteInEditor() {
        if(confirm("Удалить эту игру навсегда?")) {
            await db.games.delete(editingId);
            closeEditor();
            renderLibrary();
        }
    }

    async function quickDelete(e, id) {
        e.stopPropagation();
        if(confirm("Удалить?")) {
            await db.games.delete(id);
            renderLibrary();
        }
    }

    function previewMedia(event) {
        const file = event.target.files[0];
        if(!file) return;
        tempMediaType = file.type.startsWith('video') ? 'video' : 'image';
        const reader = new FileReader();
        reader.onload = (e) => { tempMedia = e.target.result; alert("Медиа готово."); };
        reader.readAsDataURL(file);
    }

    async function saveChanges() {
        await db.games.update(editingId, { title: document.getElementById('edit-name').value, cover: tempMedia, mediaType: tempMediaType, ytId: document.getElementById('edit-yt').value });
        closeEditor(); renderLibrary();
    }

    function closeEditor() { document.getElementById('editor-overlay').style.display = 'none'; }

    // --- ЛОГИКА БИБЛИОТЕКИ ---
    async function renderLibrary() {
        games = await db.games.toArray();
        filteredGames = currentFilter === 'all' ? games : games.filter(g => g.system === currentFilter);
        const scroller = document.getElementById('scroller');
        scroller.innerHTML = filteredGames.length ? '' : `<div class="omni-card active font-black text-center p-10 italic" onclick="document.getElementById('fileInput').click()">CLICK + TO ADD</div>`;
        
        filteredGames.reverse().forEach((g, i) => {
            const card = document.createElement('div');
            card.className = `omni-card ${i === currentIndex ? 'active' : ''}`;
            
            let mediaHTML = `<img src="${g.cover}" class="card-media" onerror="this.src='https://via.placeholder.com/300x450/111/fff?text=${g.title}'">`;
            if (g.ytId) mediaHTML = `<iframe class="card-media" src="https://www.youtube.com/embed/${g.ytId}?autoplay=1&mute=1&controls=0&loop=1&playlist=${g.ytId}"></iframe>`;
            else if (g.mediaType === 'video') mediaHTML = `<video class="card-media" src="${g.cover}" autoplay muted loop></video>`;

            card.innerHTML = `
                <div class="card-delete-quick" onclick="quickDelete(event, ${g.id})">🗑️</div>
                ${mediaHTML}
                <div class="mt-6 text-center">
                    <p class="text-[8px] font-black text-cyan-400 uppercase">${g.system}</p>
                    <h2 class="text-xl font-black italic uppercase">${g.title}</h2>
                </div>
            `;
            
            card.oncontextmenu = (e) => { e.preventDefault(); openEditor(g); };
            let timer;
            card.ontouchstart = () => { timer = setTimeout(() => openEditor(g), 800); };
            card.ontouchend = () => clearTimeout(timer);

            card.onclick = () => { if(i === currentIndex) launchCurrent(); else { currentIndex = i; updateSelection(); } };
            scroller.appendChild(card);
        });
        currentIndex = 0; updateSelection();
    }

    function updateSelection() {
        const offset = window.innerWidth / 2 - (currentIndex * 380) - 150;
        document.getElementById('scroller').style.transform = `translateX(${offset}px)`;
        document.querySelectorAll('.omni-card').forEach((c, i) => {
            const dist = Math.abs(i - currentIndex);
            c.classList.toggle('active', i === currentIndex);
            c.style.opacity = dist > 2 ? 0 : (1 - dist * 0.4);
            c.style.transform = `rotateY(${(i - currentIndex) * -30}deg) scale(${i === currentIndex ? 1.15 : 0.75})`;
        });
        if(filteredGames[currentIndex]) document.getElementById('hud-title').innerText = filteredGames[currentIndex].title;
    }

    // --- СИСТЕМНЫЕ ФУНКЦИИ ---
    async function initAether() {
        if(audioUnlocked) return; audioUnlocked = true;
        const savedNick = await db.settings.get("nickname");
        if(savedNick) { userNick = savedNick.val; document.getElementById('user-display').innerText = userNick; }
        renderLibrary();
    }

    const systemMap = { 'nes':'nes','snes':'snes','sfc':'snes','gba':'gba','gbc':'gbc','gb':'gb','md':'segaMD','bin':'psx','chd':'psx','iso':'psx','nds':'nds','exe':'dos','pce':'pce','zip':'mame' };
    async function importGames(event) {
        for (const file of event.target.files) {
            const ext = file.name.split('.').pop().toLowerCase();
            const title = file.name.replace(/\.[^/.]+$/, "");
            let sys = systemMap[ext] || 'nes';
            if(ext==='iso' && file.size > 400000000) sys = confirm("PS2?") ? 'play' : 'psx';
            const cover = `https://raw.githubusercontent.com/libretro-thumbnails/libretro-thumbnails/master/Sony_-_PlayStation/Named_Boxarts/${encodeURIComponent(title)}.png`;
            await db.games.add({ title, system: sys, romBlob: file, cover, mediaType: 'image', ytId: '' });
        }
        renderLibrary();
    }

    async function launchCurrent() {
        const game = filteredGames[currentIndex]; if(!game) return;
        document.getElementById('emulator-container').style.display = 'block';
        window.EJS_player = '#game'; window.EJS_gameUrl = URL.createObjectURL(game.romBlob);
        window.EJS_core = game.system; window.EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/';
        window.EJS_startOnLoad = true; if(isMobile) window.EJS_browserMode = 'mobile';
        if (game.system.includes('ps') || game.system === 'play') document.getElementById('emulator-container').classList.add('is-psx');
        const script = document.createElement('script'); script.src = 'https://rawcdn.githack.com/EmulatorJS/EmulatorJS/main/data/loader.js';
        document.body.appendChild(script);
    }

    function changeTheme(t) { document.body.className = 'theme-' + t; if(!isMobile) document.body.classList.add('is-pc'); localStorage.setItem('retro-theme', t); }
    function setFilter(s, b) { currentFilter = s; document.querySelectorAll('.c-btn').forEach(x => x.classList.remove('active')); b.classList.add('active'); renderLibrary(); }
    function switchPage(id) { document.querySelectorAll('.ui-page').forEach(p => p.classList.remove('active-page')); document.getElementById('page-' + id).classList.add('active-page'); }
    function changeNick() { const n = prompt("Ник:"); if(n) { userNick = n.toUpperCase(); document.getElementById('user-display').innerText = userNick; db.settings.put({key:"nickname", val:userNick}); } }

    document.addEventListener('mousemove', e => { const c = document.getElementById('custom-cursor'); c.style.left = e.clientX - 15 + 'px'; c.style.top = e.clientY - 15 + 'px'; });
    changeTheme(localStorage.getItem('retro-theme') || 'ps5');
</script>
</body>
</html>
